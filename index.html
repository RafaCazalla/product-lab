    const below = verRows.filter(r => r.ci && r.ci[1] < all.avg)
      .sort((a, b) => a.s.avg - b.s.avg);
    const verIns = below.length
      ? t('{v} queda por debajo de la media del corte con certeza: {a} frente a {m}, con {n} valoraciones.',
          { v: below[0].v, a: star(below[0].s.avg), m: star(all.avg), n: nf(below[0].s.n) })
      : t('Ninguna versión con n ≥ 60 se separa de la media del corte con certeza: los intervalos se solapan.');
    g.appendChild(plotCard({
      key: 'ver', span: 'c6', title: t('Rating medio por versión de la app'),
      sub: t('versiones con n ≥ 60 · bigote = intervalo de la media al 95 % · la línea es la media del corte'),
      insight: verIns,
      draw: groupedCols({
        groups: verRows.map(r => r.v + '\n' + t('n {n}', { n: nf(r.s.n) })),
        series: [{
          name: t('Rating medio'), color: 'var(--s1)',
          values: verRows.map(r => r.s.avg),
          ci: verRows.map(r => r.ci),
          bases: verRows.map(r => r.s.n),
        }],
        height: 248, fmt: v => nf(v, 1), refLine: all.avg, refLabel: t('media {m}', { m: star(all.avg) }),
        alt: t('Rating medio por versión de la app'),
      }),
      note: t('Las valoraciones sin versión ({n} en el corte) quedan fuera: Google Play no la reporta en una parte de los envíos y su nota es sensiblemente peor, así que mezclarlas ensuciaría la comparación. El bigote es el intervalo de la media al 95 %, calculado con la t de Student sobre el reparto completo de estrellas; no es el de Wilson, que sirve para una proporción como el % de 1-2★ y no para una media. Cuando una versión concentra la mayor parte de la base, la línea de media del corte es casi esa misma versión: la comparación que informa es entre versiones, no contra la línea.',
        { n: nf((byVer.get('') || BUCK()).reduce((x, y) => x + y, 0)) }),
      tableFn: () => table([t('Versión'), 'n', t('Rating'), t('IC 95 %'), '1-2★'],
        verRows.map(r => [r.v, nf(r.s.n), star(r.s.avg),
          r.ci ? nf(r.ci[0], 2) + ' – ' + nf(r.ci[1], 2) : '—', rpct(r.s.bad)])),
    }));
  }

  /* --- dispositivos problemáticos con guarda estadística --- */
  const byDev = bucketBy(ids, i => RD.devs[R_dev[i]]);
  const devRows = [...byDev.entries()].map(([d, a]) => {
    const s = statOf(a), bad = a[0] + a[1], ci = wilson(bad, s.n);
    return { d, n: s.n, bad, avg: s.avg, rate: s.bad, lo: ci[0] * 100, hi: ci[1] * 100, fam: FAMS[DEV_IDX[d]] };
  }).filter(r => r.n >= 30);
  const worse = devRows.filter(r => r.lo > globalBad).sort((a, b) => b.lo - a.lo);
  const devIns = worse.length
    ? t('{d} es el peor: {p} de notas 1-2★, frente al {g} global.',
        { d: worse[0].d, p: rpct(worse[0].rate), g: rpct(globalBad) })
    : t('Ningún modelo con n ≥ 30 se separa de la media con certeza.');
  g.appendChild(plotCard({
    key: 'dev-worse', span: 'c6', title: t('Dispositivos peores que la media, con certeza'),
    sub: t('{a} de {b} modelos con n ≥ 30 cuyo intervalo de confianza al 95 % queda entero por encima del {p} global',
      { a: worse.length, b: devRows.length, p: rpct(globalBad) }),
    insight: devIns,
    draw: barsH({
      rows: worse.slice(0, 12).map(r => ({
        label: r.d, value: r.rate, ci: [r.lo, r.hi],
        color: TRANSSION.indexOf(r.fam) >= 0 ? 'var(--s3)' : 'var(--s5)',
        rows: [{ color: 'var(--deemph)', value: t('IC95') + ' ' + nf(r.lo, 1) + '–' + nf(r.hi, 1) + ' %', name: '' },
               { color: 'var(--deemph)', value: nf(r.n), name: 'n' }],
      })),
      fmt: v => nf(v, 1) + ' %', labelW: 108, valW: 62, unit: '1-2★',
      alt: t('Dispositivos peores que la media, con certeza') + '. ' + devIns,
    }),
    legend: legend([{ name: 'Transsion', color: 'var(--s3)' }, { name: t('otras familias'), color: 'var(--s5)' }]),
    note: t('Los bigotes son el intervalo de Wilson al 95 %. Exigir que no toque la media evita perseguir modelos que solo parecen malos por tener pocas valoraciones. El nombre es el codename que reporta Play, no el comercial.'),
    tableFn: () => table([t('Modelo'), t('Familia'), 'n', '1-2★', t('IC 95 %'), t('Rating')],
      devRows.sort((a, b) => b.lo - a.lo).map(r => [
        r.d, famLabel(r.fam), nf(r.n), rpct(r.rate),
        nf(r.lo, 1) + ' – ' + nf(r.hi, 1) + ' %', star(r.avg),
      ])),
  }));

  /* --- evolución por idioma.
         Tres decisiones que sostienen esta tarjeta:
         · El eje lleva TODOS los periodos del rango, no solo los que tienen
           datos. Si se colocaran los puntos por posición, un hueco de tres
           semanas se vería igual que un día y el eje mentiría.
         · Un punto necesita al menos MIN_POINT valoraciones. Por debajo, la
           media de una nota es ruido: con n=10 el error típico ronda ±0,3 en
           una escala de 1 a 5.
         · Un solo eje (rating 1-5) y el color sigue al idioma en orden fijo,
           no a su posición en la serie. --- */
  g.appendChild(eyebrow(t('Evolución en el tiempo'), 'eb-time'));
  const MIN_POINT = 30, THIN_POINT = 150;
  const GRAINS = [
    { id: 'day',   label: 'Día' },
    { id: 'week',  label: 'Semana' },
    { id: 'month', label: 'Mes' },
  ];
  const grain = GRAINS.some(x => x.id === rstate.grain) ? rstate.grain : 'week';

  /* clave del periodo al que cae una fecha, y etiqueta para el eje */
  const periodOf = (dayn, gr) => gr === 'month' ? Math.floor(dayn / 100)
    : gr === 'week' ? numOf(weekOf(dayn)) : dayn;
  const periodLabel = (key, gr) => gr === 'month' ? monthName(key % 100 - 1) : dmy(key);

  /* Todos los periodos del rango, con datos o sin ellos. */
  function periodsIn(gr, fromN, toN) {
    const out = [];
    const mk = n => new Date(Date.UTC(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100));
    const num = d2 => d2.getUTCFullYear() * 10000 + (d2.getUTCMonth() + 1) * 100 + d2.getUTCDate();
    if (gr === 'month') {
      let y = Math.floor(fromN / 10000), m = Math.floor(fromN / 100) % 100;
      const ly = Math.floor(toN / 10000), lm = Math.floor(toN / 100) % 100;
      while (y * 100 + m <= ly * 100 + lm) {
        out.push(y * 100 + m);
        m++; if (m > 12) { m = 1; y++; }
      }
      return out;
    }
    let d2 = mk(fromN);
    if (gr === 'week') d2 = mk(numOf(weekOf(fromN)));
    const end = mk(toN);
    while (d2 <= end) {
      out.push(num(d2));
      d2.setUTCDate(d2.getUTCDate() + (gr === 'week' ? 7 : 1));
    }
    return out;
  }

  const evoIds = rSel({ lang: 1 });
  /* Un idioma entra si tiene volumen para dar al menos dos puntos dibujables. */
  const evoLangs = TOP_LANGS.filter(l => {
    const mine = evoIds.filter(i => RD.langs[R_lang[i]] === l);
    if (mine.length < MIN_POINT * 2) return false;
    const per = {};
    mine.forEach(i => { const k = periodOf(R_dayn[i], grain); per[k] = (per[k] || 0) + 1; });
    return Object.keys(per).filter(k => per[k] >= MIN_POINT).length >= 2;
  });
  const oneStar = /^[1-5]$/.test(rstate.rating);
  const keys = evoIds.length ? periodsIn(grain, rstate.from, rstate.to) : [];

  if (keys.length >= 2 && evoLangs.length && !oneStar) {
    const COLS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
    const cell = {};
    evoIds.forEach(i => {
      const l = RD.langs[R_lang[i]];
      if (evoLangs.indexOf(l) < 0) return;
      const k = l + '|' + periodOf(R_dayn[i], grain);
      (cell[k] = cell[k] || []).push(R_rat[i]);
    });
    const bases = evoLangs.map(l => keys.map(k => (cell[l + '|' + k] || []).length));
    const evo = evoLangs.map((l, k) => ({
      name: langName(l), color: COLS[k % COLS.length], emph: k === 0,
      values: keys.map((key, j) => {
        const a = cell[l + '|' + key];
        return a && a.length >= MIN_POINT ? a.reduce((x, y) => x + y, 0) / a.length : null;
      }),
    }));
    const thin = evoLangs.map((l, k) => keys.map((key, j) => bases[k][j] < THIN_POINT));
    const drawn = evo.reduce((a, sr) => a + sr.values.filter(v => v !== null).length, 0);

    /* El aviso concreto: el mayor salto entre puntos consecutivos DIBUJADOS,
       con el cambio de base debajo, que es lo que suele explicarlo. */
    let jump = null;
    evo.forEach((sr, k) => {
      let prev = -1;
      for (let j = 0; j < keys.length; j++) {
        if (sr.values[j] === null) continue;
        if (prev >= 0) {
          const d = Math.abs(sr.values[j] - sr.values[prev]);
          if (d >= 0.25 && (!jump || d > jump.d)) {
            jump = { d, l: sr.name, va: sr.values[prev], vb: sr.values[j],
                     from: keys[prev], to: keys[j], na: bases[k][prev], nb: bases[k][j] };
          }
        }
        prev = j;
      }
    });
    const evoIns = jump
      ? t('{l} pasa de {a} a {b} entre {ma} y {mb}, pero su base pasa de {na} a {nb} valoraciones.', {
          l: jump.l, a: star(jump.va), b: star(jump.vb),
          ma: periodLabel(jump.from, grain), mb: periodLabel(jump.to, grain),
          na: nf(jump.na), nb: nf(jump.nb) })
      : t('Ningún idioma se mueve más de 0,25 puntos entre puntos consecutivos.');

    /* selector de grano: el mismo dato a tres resoluciones */
    const gsel = E('div');
    gsel.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
    GRAINS.forEach(x => {
      const b = E('button', 'mini', t(x.label));
      b.type = 'button';
      b.setAttribute('aria-pressed', String(x.id === grain));
      b.addEventListener('click', () => { rstate.grain = x.id; renderActive(); });
      gsel.appendChild(b);
    });

    const titulo = grain === 'day' ? t('Rating por idioma, día a día')
      : grain === 'week' ? t('Rating por idioma, semana a semana')
      : t('Rating por idioma, mes a mes');
    g.appendChild(plotCard({
      key: 'evo', span: 'c12', title: titulo,
      sub: t('{n} puntos dibujados de {total} posibles · hueco donde el periodo no llega a {min} valoraciones · punto hueco = base menor de {thin}',
        { n: nf(drawn), total: nf(keys.length * evoLangs.length), min: MIN_POINT, thin: THIN_POINT }),
      insight: evoIns,
      extra: gsel,
      legend: legend(evo.map(x => ({ color: x.color, name: x.name })), 'line'),
      draw: lineChart({
        x: keys.map(k => periodLabel(k, grain)),
        series: evo, bases, thin, bands: [],
        fmt: v => nf(v, 2), height: 300, padR: 66, yMax: 5,
        alt: titulo + '. ' + evoIns,
      }),
      note: t('El eje lleva todos los {gr} del rango, también los que no tienen datos: así un hueco de varias semanas no se ve como un día. La recolección llegó en {k} lotes y se concentra en la primera quincena de cada mes, así que dos periodos contiguos NO son muestras comparables. Con el grano diario hay idiomas que casi no dibujan porque no reúnen {min} valoraciones al día: eso es la muestra, no un problema del panel.',
        { gr: grain === 'day' ? t('días') : grain === 'week' ? t('semanas') : t('meses'),
          k: RD.meta.batches.length, min: MIN_POINT }),
      tableFn: () => table([t('Periodo')].concat(evo.map(x => x.name)).concat(evo.map(x => x.name + ' · n')),
        keys.map((k, j) => [periodLabel(k, grain)]
          .concat(evo.map(x => x.values[j] === null ? '—' : star(x.values[j])))
          .concat(bases.map(b => nf(b[j]))))),
    }));
  }

  /* --- cobertura de la muestra: el aviso honesto --- */
  g.appendChild(eyebrow(t('Calidad de la muestra'), 'eb-sample'));
  const byWeek = bucketBy(ids, i => weekOf(R_dayn[i]));
  const weeks = [...byWeek.entries()].map(([w, a]) => ({ w, s: statOf(a) })).sort((a, b) => a.w.localeCompare(b.w));
  const solid = weeks.filter(r => r.s.n >= 100);
  const thinN = weeks.filter(r => r.s.n < 100).length;
  const covIns = t('{k} de {n} semanas del corte no llegan a 100 valoraciones.',
    { k: thinN, n: weeks.length });
  g.appendChild(plotCard({
    key: 'cov', span: 'c6', title: t('Valoraciones recogidas por semana'),
    insight: covIns,
    sub: t('la recolección llegó en {n} lotes y no cubre todas las semanas por igual', { n: RD.meta.batches.length }),
    draw: barsH({
      rows: weeks.map(r => ({
        label: dmy(numOf(r.w)), value: r.s.n,
        color: r.s.n >= 100 ? 'var(--s1)' : 'var(--deemph)',
        rows: [{ color: 'var(--deemph)', value: star(r.s.avg), name: t('rating') }],
      })),
      fmt: v => nf(v), labelW: 52, valW: 62, unit: t('valoraciones'),
      alt: t('Valoraciones recogidas por semana') + '. ' + covIns,
    }),
    legend: legend([{ name: t('semana con muestra suficiente (n ≥ 100)'), color: 'var(--s1)' },
                    { name: t('cobertura parcial: no leer tendencia'), color: 'var(--deemph)' }]),
    note: (() => {
      const thin = weeks.filter(r => r.s.n < 100).map(r => r.s.n);
      const best = weeks.length ? Math.max(...weeks.map(r => r.s.n)) : 0;
      if (!thin.length) return t('Todas las semanas del corte tienen muestra suficiente (n ≥ 100), pero la recolección llegó en {n} lotes: compara semanas con cautela.',
        { n: RD.meta.batches.length });
      return t('No hay serie temporal fiable en estos datos: las semanas en gris tienen entre {lo} y {hi} valoraciones frente a las {best} de la mejor. Cualquier subida o bajada entre semanas puede ser solo el calendario del volcado.',
        { lo: nf(Math.min(...thin)), hi: nf(Math.max(...thin)), best: nf(best) });
    })(),
    tableFn: () => table([t('Semana del'), 'n', t('Rating'), '1-2★', t('Muestra')],
      weeks.map(r => [dmy(numOf(r.w)), nf(r.s.n), star(r.s.avg), rpct(r.s.bad), r.s.n >= 100 ? t('suficiente') : t('parcial')])),
  }));



  g.appendChild(eyebrow(t('Interpretación'), 'eb-ctx'));
  g.appendChild(contextCard('rating'));

  layoutModules('rating', g);
  root.appendChild(g);
}

/* ============================== VISTA · REVIEWS =========================== */
/* lista de verbatims: el dato en crudo, filtrable y legible. Ningún valor de
   esta vista vive solo en un color o en un tooltip. */
function verbatimList(tis) {
  const box = E('div', 'vlist');
  const sorted = tis.slice();
  if (rstate.sort === 'worst') sorted.sort((a, b) => R_rat[RD.rev[a].n] - R_rat[RD.rev[b].n] || R_dayn[RD.rev[b].n] - R_dayn[RD.rev[a].n]);
  else if (rstate.sort === 'long') sorted.sort((a, b) => RD.rev[b].x.length - RD.rev[a].x.length);
  else sorted.sort((a, b) => R_dayn[RD.rev[b].n] - R_dayn[RD.rev[a].n]);

  sorted.slice(0, rstate.limit).forEach(ti => {
    const rec = RD.rev[ti], i = rec.n;
    const row = E('div', 'vrow');
    const st = E('div');
    const s = E('div', 'vstars', R_rat[i] + '★');
    s.style.color = R_rat[i] <= 2 ? 'var(--crit)' : R_rat[i] === 3 ? 'var(--warn)' : 'var(--good)';
    st.appendChild(s);
    row.appendChild(st);

    const main = E('div');
    const meta = E('div', 'vmeta');
    [langName(RD.langs[R_lang[i]]), RD.vers[R_ver[i]] || t('sin versión'),
     RD.devs[R_dev[i]], famLabel(FAMS[R_fam[i]]), dmy(R_dayn[i])]
      .forEach((t, k) => { if (k) meta.appendChild(E('span', '', '·')); meta.appendChild(E('span', '', t)); });
    main.appendChild(meta);
    main.appendChild(E('div', 'vtext', rec.x));

    const tags = E('div', 'vtags');
    const sp = E('span', 'tag', sentLabel(rec.s));
    sp.style.cssText = 'background:var(--sunken);color:var(--ink-2);font-weight:600';
    tags.appendChild(sp);
    rec.g.forEach(g => tags.appendChild(E('span', 'tag', topicLabel(g))));
    if (!rec.k) tags.appendChild(E('span', 'tag', t('sin contenido')));
    main.appendChild(tags);

    if (rec.y >= 0) {
      const rp = E('div', 'vreply');
      rp.textContent = t('Respuesta del equipo')
        + (R_lat[i] >= 0 ? ' · ' + (R_lat[i] === 0 ? t('mismo día') : t('{n} d', { n: R_lat[i] })) : '')
        + ': ' + RD.tpl[rec.y];
      main.appendChild(rp);
    }
    row.appendChild(main);
    box.appendChild(row);
  });
  return box;
}

function renderReviews(root) {
  const g = E('div', 'grid');
  const ids = rSel();                     /* todas las valoraciones del corte */
  const tis = rSelText();                 /* reviews que pasan también los filtros de texto */
  const tAll = rSelText({ topic: 1, sent: 1 });

  /* --- el embudo de la voz: por qué 9.764 notas dan tan poca información --- */
  const fText = ids.filter(i => R_text[i] >= 0);
  const fCont = fText.filter(i => RD.rev[R_text[i]].k);
  const fTopic = fCont.filter(i => RD.rev[R_text[i]].g.some(t => t !== 'praise'));
  const fFric = fTopic.filter(i => RD.rev[R_text[i]].w);

  g.appendChild(eyebrow(t('La voz · lo que escriben los que escriben')));
  g.appendChild(srcNote(t('el texto es opcional en Google Play, y ahí está el cuello de botella')));
  if (!ids.length) {
    g.appendChild(emptyCut(t('Ninguna valoración cumple este corte'),
      t('Sin valoraciones no hay reviews que analizar. Amplía el rango de fechas o quita uno de los filtros de idioma, dispositivo o nota.')));
    root.appendChild(g);
    return;
  }

  /* --- héroe --- */
  const hero = card('c5');
  const hb = E('div', 'hero'), left = E('div');
  left.appendChild(E('div', 'lbl', t('Reviews con señal accionable') + ' · ' + rCutLabel()));
  left.appendChild(E('div', 'fig', nf(fTopic.length)));
  const dl = E('div', 'delta flat');
  dl.textContent = t('{p} de las {n} valoraciones del corte',
    { p: rpct(ids.length ? fTopic.length / ids.length * 100 : 0, 2), n: nf(ids.length) });
  left.appendChild(dl);
  hb.appendChild(left);
  const side = E('div', 'side');
  side.appendChild(E('div', '', t('Texto con un tema de producto identificado, descontando el ruido y el elogio genérico.')));
  const sm = E('div'); sm.style.marginTop = '8px';
  sm.appendChild(E('div', '', t('De esas, con fricción declarada')));
  const mt = meter(fFric.length, Math.max(1, fTopic.length), 'var(--s3)'); mt.style.margin = '5px 0 3px'; sm.appendChild(mt);
  sm.appendChild(E('div', '', t('{n} reviews piden o critican algo', { n: nf(fFric.length) })));
  side.appendChild(sm);
  hb.appendChild(side);
  hero.appendChild(hb);
  g.appendChild(mod(hero, 'hero', t('Reviews con señal accionable')));

  const per100 = ids.length ? fTopic.length / ids.length * 100 : 0;
  const funIns = t('De cada 100 valoraciones, {n} dejan algo sobre lo que actuar.',
    { n: nf(per100, 1) });
  g.appendChild(plotCard({
    key: 'funnel', span: 'c7', title: t('Embudo de la voz del usuario'),
    sub: t('cada paso es un subconjunto del anterior'),
    insight: funIns,
    draw: funnel({
      alt: t('Embudo de la voz del usuario') + '. ' + funIns,
      unit: t('valoraciones'),
      steps: [
        { label: t('Valoraciones en el corte'), value: ids.length },
        { label: t('Dejan además un texto'), value: fText.length },
        { label: t('El texto dice algo (no es ruido ni nombre propio)'), value: fCont.length },
        { label: t('Se le identifica un tema de producto'), value: fTopic.length },
        { label: t('Además expresa fricción: critica o pide'), value: fFric.length },
      ],
    }),
    note: t('Escribir es opcional en Google Play: de ahí la caída del primer paso. Sin texto, una nota no es respondible ni diagnosticable.'),
    tableFn: () => {
      const st = [[t('Valoraciones en el corte'), ids.length], [t('Dejan un texto'), fText.length],
                  [t('El texto dice algo'), fCont.length], [t('Con tema identificado'), fTopic.length],
                  [t('Con fricción declarada'), fFric.length]];
      return table([t('Paso'), t('Reviews'), t('% del paso anterior'), t('% del total')],
        st.map((r, k) => [r[0], nf(r[1]),
          k ? rpct(st[k - 1][1] ? r[1] / st[k - 1][1] * 100 : 0) : '—',
          rpct(ids.length ? r[1] / ids.length * 100 : 0, 2)]));
    },
  }));

  /* --- KPI --- */
  const nFric = tAll.filter(t => RD.rev[t].w).length;
  const sentCount = {}; SENTS.forEach(s => { sentCount[s.id] = 0; });
  tAll.forEach(t => { sentCount[RD.rev[t].s]++; });
  const netto = tAll.length ? (sentCount.pos - sentCount.neg - sentCount.mix) / tAll.length * 100 : 0;
  const kc = card('c12');
  const kg = E('div'); kg.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px 22px';
  [
    { label: t('Reviews en el corte'), value: nf(tAll.length), foot: t('tras los filtros de texto') },
    { label: t('Con fricción'), value: rpct(tAll.length ? nFric / tAll.length * 100 : 0), foot: t('{n} critican o piden', { n: nf(nFric) }) },
    { label: t('Balance de sentimiento'), value: signed(netto, 0) + ' pp', foot: t('elogio menos queja y petición') },
    { label: t('Longitud mediana'), value: (() => {
        const L = tAll.map(x => RD.rev[x].x.length).sort((a, b) => a - b);
        return L.length ? t('{n} car.', { n: nf(L[Math.floor(L.length / 2)]) }) : '—';
      })(), foot: (() => {
        const L = tAll.map(x => RD.rev[x].x.length).sort((a, b) => a - b);
        return L.length ? t('p90 {n} car.', { n: nf(L[Math.floor(L.length * .9)]) }) : '—';
      })() },
  ].forEach(o => kg.appendChild(kpiTile(o)));
  kc.appendChild(kg);
  g.appendChild(mod(kc, 'kpi', t('Reviews en el corte')));

  /* --- de aquí abajo todo necesita texto: si el corte no deja ninguna review,
         se explica y se para, en vez de pintar mapas de calor en blanco --- */
  if (!tAll.length) {
    g.appendChild(emptyCut(t('Este corte no deja ninguna review con texto'),
      t('Hay {n} valoraciones, pero ninguna trae texto que pase los filtros. Solo el {p} de las valoraciones lleva texto, así que en cuanto se cruzan idioma, dispositivo y nota el texto se agota. Prueba a desmarcar «Descartar ruido» o a quitar el filtro de tema.',
        { n: nf(ids.length), p: rpct(RD.meta.n_text / RD.meta.n * 100, 1) })));
    root.appendChild(g);
    return;
  }

  /* --- temas: volumen Y signo en la misma marca --- */
  g.appendChild(eyebrow(t('Qué temas aparecen, y con qué signo'), 'eb-topics'));
  const tCount = {}, tSign = {}, tFric = {};
  PROBLEM_TOPICS.forEach(t => {
    tCount[t] = 0; tFric[t] = 0;
    tSign[t] = { neg: 0, neu: 0, pos: 0 };
  });
  tAll.forEach(ti => {
    const sg = signOf(R_rat[RD.rev[ti].n]);
    RD.rev[ti].g.forEach(t => {
      if (t === 'praise') return;
      tCount[t]++; tSign[t][sg]++;
      if (RD.rev[ti].w) tFric[t]++;
    });
  });
  const tOrder = PROBLEM_TOPICS.filter(t => tCount[t] > 0).sort((a, b) => tCount[b] - tCount[a]);
  const negShare = t => tCount[t] ? tSign[t].neg / tCount[t] * 100 : 0;

  const topIns = tOrder.length
    ? t('{tema} es el más mencionado ({n}); el {p} de sus menciones son de 1-2★.',
        { tema: topicLabel(tOrder[0]), n: nf(tCount[tOrder[0]]), p: rpct(negShare(tOrder[0]), 0) })
    : '';
  g.appendChild(plotCard({
    key: 'topics-sign', span: 'c12', title: t('Temas por volumen y signo de la nota'),
    insight: topIns,
    sub: t('largo total = menciones · color = nota con la que se mencionan · una review puede llevar varios temas'),
    legend: legend(SIGNS.map(x => ({ name: signLabel(x.id), color: x.color }))),
    draw: stackedBarsH({
      rows: tOrder.map(x => ({ label: topicLabel(x), values: tSign[x] })),
      keys: SIGNS.map(x => ({ id: x.id, name: signLabel(x.id), color: x.color })),
      fmt: v => nf(v), labelW: 186, valW: 56, rowH: 30, labelShare: true, unit: t('menciones'),
      alt: t('Temas por volumen y signo de la nota') + '. ' + topIns,
    }),
    note: t('El signo es la estrella que puso quien escribió, no una lectura del texto: es inequívoco. Para quedarte con un solo lado, usa el filtro «Nota» de arriba.'),
    tableFn: () => table([t('Tema'), t('Menciones'), t('Negativas 1-2★'), t('Neutras 3★'), t('Positivas 4-5★'), t('% negativas')],
      tOrder.map(x => [topicLabel(x), nf(tCount[x]), nf(tSign[x].neg), nf(tSign[x].neu), nf(tSign[x].pos), rpct(negShare(x))]),
      [t('Total'), nf(tOrder.reduce((a, x) => a + tCount[x], 0)),
       nf(tOrder.reduce((a, x) => a + tSign[x].neg, 0)),
       nf(tOrder.reduce((a, x) => a + tSign[x].neu, 0)),
       nf(tOrder.reduce((a, x) => a + tSign[x].pos, 0)), '']),
  }));

  /* --- ordenado por acidez, que es otra pregunta distinta del volumen --- */
  const acid = tOrder.filter(t => tCount[t] >= 5).sort((a, b) => negShare(b) - negShare(a));
  if (acid.length >= 3) {
    const globalNeg = tAll.length
      ? tAll.filter(t => signOf(R_rat[RD.rev[t].n]) === 'neg').length / tAll.length * 100 : 0;
    const acidIns = t('{tema} es el más ácido: {p} de sus menciones son de 1-2★.',
      { tema: topicLabel(acid[0]), p: rpct(negShare(acid[0]), 0) });
    g.appendChild(plotCard({
      key: 'acid', span: 'c6', title: t('Qué temas son más ácidos'),
      insight: acidIns,
      sub: t('% de menciones con 1-2★ · temas con 5 o más menciones · la línea es la media del corte'),
      draw: groupedCols({
        groups: acid.map(x => { const w = topicLabel(x).split(/[ ,]+/); return w[0] + '\n' + (w[1] || ''); }),
        series: [{ name: t('% negativas'), color: 'var(--div-neg)', values: acid.map(negShare) }],
        height: 236, fmt: v => nf(v, 0) + ' %', refLine: globalNeg, refLabel: t('media {m}', { m: rpct(globalNeg, 0) }),
        alt: t('Qué temas son más ácidos') + '. ' + acidIns,
      }),
      note: t('Volumen y acidez son dos preguntas distintas y esta tarjeta responde la segunda. Con menos de 5 menciones el porcentaje no dice nada, así que esos temas quedan fuera.'),
      tableFn: () => table([t('Tema'), t('Menciones'), t('% negativas'), t('% positivas')],
        acid.map(x => [topicLabel(x), nf(tCount[x]), rpct(negShare(x)),
                       rpct(tCount[x] ? tSign[x].pos / tCount[x] * 100 : 0)])),
    }));
  }

  /* --- tema x idioma: el hallazgo --- */
  /* «critican» = 1-2★. Se usa la estrella y no el flag de fricción para que en
     todo el análisis de temas la palabra signifique lo mismo. */
  const negAll = rSelText({ topic: 1, sent: 1 }).filter(t => signOf(R_rat[RD.rev[t].n]) === 'neg');
  const langBase = {};
  rSelText({ topic: 1, sent: 1 }).forEach(t => {
    const l = RD.langs[R_lang[RD.rev[t].n]];
    langBase[l] = (langBase[l] || 0) + 1;
  });
  const cols = TOP_LANGS.filter(l => (langBase[l] || 0) >= 30);
  const topTopics = tOrder.filter(x => tCount[x] >= 4).slice(0, 8);
  const tlRows = topTopics.map(x => ({
    label: topicLabel(x),
    values: cols.map(l => {
      const n = negAll.filter(ti => RD.langs[R_lang[RD.rev[ti].n]] === l && RD.rev[ti].g.indexOf(x) >= 0).length;
      return langBase[l] ? n / langBase[l] * 100 : null;
    }),
  }));
  if (cols.length) {
    /* por idioma, cuál es su tema más criticado: el cruce que separa mercados */
    const perLang = cols.map(l => {
      const cnt = {};
      negAll.filter(ti => RD.langs[R_lang[RD.rev[ti].n]] === l)
        .forEach(ti => RD.rev[ti].g.forEach(g2 => { if (g2 !== 'praise') cnt[g2] = (cnt[g2] || 0) + 1; }));
      const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
      return top ? { l, top, p: cnt[top] / langBase[l] * 100 } : null;
    }).filter(Boolean);
    const langTopIns = perLang.length
      ? perLang.map(x => t('{l}: {tema} ({p})',
          { l: langName(x.l), tema: topicLabel(x.top), p: rpct(x.p, 1) })).join(' · ')
      : '';
    g.appendChild(plotCard({
      key: 'lang-topics', span: 'c6', title: t('Qué duele en cada idioma'),
      insight: langTopIns,
      sub: t('% de las reviews del idioma que critican ese tema con 1-2★'),
      draw: heatmap({
        rows: tlRows, cols: cols.map(l => langName(l) + ' (' + nf(langBase[l]) + ')'),
        labelW: 178, rowH: 26, showValues: true, fmt: v => nf(v, 1), unit: t('% del idioma'),
        alt: t('Qué duele en cada idioma') + '. ' + langTopIns,
      }),
      legend: scaleLegend(0, Math.max(...tlRows.flatMap(r => r.values.filter(v => v !== null)), 1), v => nf(v, 0) + ' %'),
      note: t('El numerador son reviews de 1-2★ que mencionan el tema; el denominador, todas las reviews de ese idioma. Se normaliza por idioma y no por el total global: si no, el español taparía todo por volumen. Entre paréntesis, la base de cada columna.'),
      tableFn: () => table([t('Tema')].concat(cols.map(l => langName(l) + ' (n=' + nf(langBase[l]) + ')')),
        tlRows.map(r => [r.label].concat(r.values.map(v => v === null ? '—' : rpct(v))))),
    }));
  }


  /* --- tema x mes --- */
  const monKeys = [...new Set(ids.map(i => Math.floor(R_dayn[i] / 100)))].sort();
  const monBase = {};
  tAll.forEach(t => {
    const m = Math.floor(R_dayn[RD.rev[t].n] / 100);
    monBase[m] = (monBase[m] || 0) + 1;
  });
  const mCols = monKeys.filter(m => (monBase[m] || 0) >= 40);
  if (mCols.length >= 2) {
    const tmRows = topTopics.map(x => ({
      label: topicLabel(x),
      values: mCols.map(m => {
        const n = negAll.filter(ti => Math.floor(R_dayn[RD.rev[ti].n] / 100) === m && RD.rev[ti].g.indexOf(x) >= 0).length;
        return monBase[m] ? n / monBase[m] * 100 : null;
      }),
    }));
    g.appendChild(plotCard({
      key: 'topic-month', span: 'c6', title: t('Cómo se mueve cada tema por mes'),
      sub: t('% de las reviews del mes que critican ese tema con 1-2★'),
      draw: heatmap({
        rows: tmRows, cols: mCols.map(m => monthName(m % 100 - 1) + ' (' + nf(monBase[m]) + ')'),
        labelW: 178, rowH: 26, showValues: true, fmt: v => nf(v, 1), unit: t('% del mes'),
        alt: t('Cómo se mueve cada tema por mes'),
      }),
      legend: scaleLegend(0, Math.max(...tmRows.flatMap(r => r.values.filter(v => v !== null)), 1), v => nf(v, 0) + ' %'),
      note: t('Por mes y no por semana a propósito: la recolección vino en lotes irregulares y una serie semanal mostraría el calendario del volcado, no el comportamiento del usuario. Aun así, la comparación entre meses es indicativa, no una tendencia medida.'),
      tableFn: () => table([t('Tema')].concat(mCols.map(m => monthName(m % 100 - 1) + ' (n=' + nf(monBase[m]) + ')')),
        tmRows.map(r => [r.label].concat(r.values.map(v => v === null ? '—' : rpct(v))))),
    }));
  }

  /* --- verbatims --- */
  g.appendChild(eyebrow(t('Las reviews, una por una'), 'eb-verb'));
  const vc = card('c12');
  const ctl = E('div');
  ctl.style.cssText = 'display:flex;gap:6px;align-items:center;flex-wrap:wrap';
  [['recent', 'Más recientes'], ['worst', 'Peor nota'], ['long', 'Más largas']].forEach(([id, lb]) => {
    const b = E('button', 'mini', t(lb));
    b.type = 'button';
    b.setAttribute('aria-pressed', String(rstate.sort === id));
    b.addEventListener('click', () => { rstate.sort = id; rstate.limit = 40; renderActive(); });
    ctl.appendChild(b);
  });
  head(vc, t('Texto original'), t('{n} reviews pasan el corte', { n: nf(tis.length) }) +
    (tis.length > rstate.limit ? ' · ' + t('se muestran las {n} primeras', { n: nf(rstate.limit) }) : ''), ctl);
  if (!tis.length) {
    const p = E('p', '', t('Ninguna review cumple estos filtros. Prueba a ampliar el rango de fechas o a quitar el filtro de tema.'));
    p.style.cssText = 'margin:6px 0;font-size:13px;color:var(--ink-3)';
    vc.appendChild(p);
  } else {
    vc.appendChild(verbatimList(tis));
    if (tis.length > rstate.limit) {
      const more = E('button', 'mini', t('Mostrar 40 más'));
      more.type = 'button';
      more.style.cssText = 'align-self:flex-start;margin-top:10px';
      more.addEventListener('click', () => { rstate.limit += 40; renderActive(); });
      vc.appendChild(more);
    }
  }
  g.appendChild(mod(vc, 'verbatims', t('Texto original')));

  g.appendChild(eyebrow(t('Interpretación'), 'eb-ctx'));
  g.appendChild(contextCard('reviews'));

  layoutModules('reviews', g);
  root.appendChild(g);
}

/* ==========================================================================
   ORDEN DE LOS MÓDULOS
   Cada módulo movible lleva en `data-mod` una clave estable e independiente
   del idioma. El orden se guarda por vista en localStorage, así que la
   disposición sobrevive a recargas, a cambios de filtro y a cambiar de idioma.
   Se mueve arrastrando la pinza del borde superior, o con las flechas cuando
   la pinza tiene el foco: sin la vía de teclado esto no sería usable sin ratón.
   La cabecera de cada vista (su eyebrow y la nota de fuente) NO es movible, para
   que el encabezado no se pueda perder por el medio.
   ========================================================================== */
const orderKey = view => 'bsp-order-' + view;
function loadOrder(view) {
  try {
    const raw = localStorage.getItem(orderKey(view));
    const a = raw ? JSON.parse(raw) : null;
    return Array.isArray(a) ? a.filter(x => typeof x === 'string') : null;
  } catch (e) { return null; }   /* sin storage: orden por defecto, sin ruido */
}
function saveOrder(view, keys) {
  try { localStorage.setItem(orderKey(view), JSON.stringify(keys)); } catch (e) { /* ídem */ }
}
function clearOrder(view) {
  try { localStorage.removeItem(orderKey(view)); } catch (e) { /* ídem */ }
}
const modsOf = g => [...g.children].filter(n => n.dataset && n.dataset.mod);

function mod(node, key, label) {
  node.dataset.mod = key;
  node.classList.add('mod');
  const grip = E('button', 'grip', '⠿⠿');
  grip.type = 'button';
  grip.draggable = true;
  grip.setAttribute('aria-label', t('Mover «{m}»: arrastra, o usa las flechas', { m: label || key }));
  node.appendChild(grip);
  return node;
}

/* Coloca los módulos en el orden guardado y engancha el arrastre. Las claves
   que no estén guardadas (módulos nuevos) se van al final en su orden natural,
   así que añadir una tarjeta no rompe la disposición de nadie. */
function layoutModules(view, g) {
  const want = loadOrder(view);
  if (want) {
    const byKey = new Map();
    modsOf(g).forEach(n => byKey.set(n.dataset.mod, n));
    const placed = new Set();
    want.forEach(k => {
      const n = byKey.get(k);
      if (n && !placed.has(k)) { g.appendChild(n); placed.add(k); }
    });
    byKey.forEach((n, k) => { if (!placed.has(k)) g.appendChild(n); });
  }
  wireModules(view, g);
}

function wireModules(view, g) {
  let dragged = null;
  const persist = () => saveOrder(view, modsOf(g).map(n => n.dataset.mod));
  const clearMarks = () => modsOf(g).forEach(n => {
    n.classList.remove('dragover-before'); n.classList.remove('dragover-after');
  });
  modsOf(g).forEach(node => {
    const grip = node.querySelector('.grip');
    if (!grip) return;
    grip.addEventListener('dragstart', ev => {
      dragged = node;
      node.classList.add('dragging');
      try {
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', node.dataset.mod);
      } catch (e) { /* algún navegador en iframe no deja tocar dataTransfer */ }
    });
    grip.addEventListener('dragend', () => {
      node.classList.remove('dragging');
      clearMarks();
      dragged = null;
      persist();
    });
    /* teclado: la misma operación sin ratón, y el foco se queda en la pinza */
    grip.addEventListener('keydown', ev => {
      const d = (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') ? -1
        : (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') ? 1 : 0;
      if (!d) return;
      ev.preventDefault();
      const sibs = modsOf(g);
      const at = sibs.indexOf(node), to = at + d;
      if (at < 0 || to < 0 || to >= sibs.length) return;
      if (d < 0) g.insertBefore(node, sibs[to]);
      else g.insertBefore(node, sibs[to].nextSibling);
      persist();
      grip.focus();
    });
    node.addEventListener('dragover', ev => {
      if (!dragged || dragged === node) return;
      ev.preventDefault();
      const r = node.getBoundingClientRect();
      const after = (ev.clientX - r.left) > r.width / 2;
      clearMarks();
      node.classList.add(after ? 'dragover-after' : 'dragover-before');
      g.insertBefore(dragged, after ? node.nextSibling : node);
    });
    node.addEventListener('drop', ev => { ev.preventDefault(); clearMarks(); });
  });
}

/* ==========================================================================
   LECTURA DE IA · BAJO DEMANDA
   El panel no interpreta por su cuenta. Todo lo que se ve sin pulsar nada es
   aritmética sobre los datos: cifras, umbrales y la advertencia de muestra.
   La interpretación —«qué significa esto y qué haría»— la escribe Claude solo
   cuando se pulsa «Ejecutar contexto», y siempre sobre el brief de datos del
   corte activo, que se puede leer y copiar entero antes de enviarlo.

   Dos caminos, según dónde se abra la página:
   · Publicada como Artifact, con la capacidad `sample` declarada: pregunta a
     Claude desde la propia página, con la cuenta de quien la mira (la primera
     llamada le pide permiso).
   · Abierta en local (file://) o sin la capacidad: no hay a quién preguntar,
     así que ofrece el prompt para copiarlo y un hueco para pegar la respuesta.
   ========================================================================== */

let SAMPLER = null;
let SAMPLER_STATE = 'pending';        /* pending · ready · absent */
const SAMPLER_WAIT = [];
(async () => {
  try {
    /* En file:// no existe window.claude; framed por un host que no contesta,
       use() resuelve null a los ~10 s. Los dos casos son «absent». */
    SAMPLER = (window.claude && typeof window.claude.use === 'function')
      ? await window.claude.use('sample') : null;
  } catch (e) { SAMPLER = null; }
  SAMPLER_STATE = SAMPLER ? 'ready' : 'absent';
  while (SAMPLER_WAIT.length) { try { SAMPLER_WAIT.shift()(); } catch (e) { /* tarjeta ya sustituida */ } }
})();
function onSampler(fn) { if (SAMPLER_STATE === 'pending') SAMPLER_WAIT.push(fn); else fn(); }

/* Una lectura describe UN corte. Si cambia el filtro, la lectura anterior ya
   no habla de las cifras que hay en pantalla, así que se guarda con la clave
   del corte y solo reaparece si se vuelve exactamente a él. */
const CTX_CACHE = new Map();
const ctxKey = view => [view, LANG, rstate.from, rstate.to, rstate.lang, rstate.fam,
                        rstate.rating, rstate.sent, rstate.topic, rstate.content, rstate.fric].join('|');

/* ---------------------------------------------------------------- el brief */
/* Texto plano con las cifras que están en pantalla. Es lo único que viaja:
   ni la tabla de datos completa ni nada que no se esté mostrando. */
function briefHead() {
  const L = [];
  L.push('PANEL: la voz del usuario de BeSoccer en Google Play.');
  L.push('FUENTE: ' + RD.meta.source + '. ' + nf(RD.meta.n) + ' valoraciones entre '
    + isoOf(D_FROM) + ' y ' + isoOf(D_TO) + ' de 2026, ' + nf(RD.meta.n_text) + ' con texto.');
  L.push('CORTE ACTIVO: ' + rCutLabel() + '.');
  L.push('AVISO DE MUESTRA: la recolección llegó en ' + RD.meta.batches.length
    + ' lotes de cobertura desigual, por lo que NO hay serie temporal fiable; no afirmes tendencias semanales.');
  if (RD.meta.dedup) L.push('LIMPIEZA: se han descartado ' + RD.meta.dedup
    + ' reviews reingeridas (la misma review devuelta en otro lote con id nuevo). En las valoraciones sin texto '
    + 'esa reingesta no se puede detectar, así que puede quedar una inflación pequeña del mismo tipo.');
  return L;
}
function briefRatings(L, short) {
  const ids = rSel();
  const st = statOf(bucketBy(ids, () => 1).get(1) || BUCK());
  if (!st.n) { L.push('SIN DATOS en este corte.'); return { ids, st }; }
  L.push('');
  L.push('NOTA GLOBAL DEL CORTE: media ' + star(st.avg) + '/5 sobre ' + nf(st.n) + ' valoraciones.');
  L.push('Reparto: ' + [5, 4, 3, 2, 1].map(k => k + '★ ' + nf(st.dist[k - 1])).join(', ') + '.');
  L.push('Negativas (1-2★): ' + rpct(st.bad) + '. Positivas (4-5★): '
    + rpct((st.dist[3] + st.dist[4]) / st.n * 100) + '.');
  const nText = ids.reduce((a, i) => a + (R_text[i] >= 0 ? 1 : 0), 0);
  const nRep = ids.reduce((a, i) => a + (R_lat[i] >= 0 ? 1 : 0), 0);
  L.push('Dejan texto: ' + nf(nText) + ' (' + rpct(st.n ? nText / st.n * 100 : 0)
    + '). Respondidas por el equipo: ' + nf(nRep) + '.');

  const byLang = bucketBy(rSel({ lang: 1 }), i => RD.langs[R_lang[i]]);
  const lr0 = [...byLang.entries()].map(([l, a]) => ({ l, s: statOf(a) }));
  const lr = lr0
    .filter(r => r.s.n >= 20).sort((a, b) => b.s.n - a.s.n);
  if (lr.length) L.push('POR IDIOMA (n>=20): ' + lr.map(r =>
    r.l + ' n=' + nf(r.s.n) + ' media=' + star(r.s.avg) + ' 1-2★=' + rpct(r.s.bad)).join(' | '));
  /* En la vista de Reviews la nota es contexto, no el objeto de la lectura:
     se manda lo justo para no diluir el brief de texto. */
  if (short) return { ids, st };

  const byFam = bucketBy(rSel({ fam: 1 }), i => FAMS[R_fam[i]]);
  const fr = [...byFam.entries()].map(([f, a]) => ({ f, s: statOf(a) }))
    .filter(r => r.s.n >= 30).sort((a, b) => a.s.avg - b.s.avg);
  if (fr.length) L.push('POR FAMILIA DE DISPOSITIVO (n>=30): ' + fr.map(r =>
    r.f + ' n=' + nf(r.s.n) + ' media=' + star(r.s.avg) + ' 1-2★=' + rpct(r.s.bad)).join(' | '));
  L.push('Nota: Tecno, Infinix e itel son del grupo Transsion (gama de entrada). '
    + 'La gama Samsung A va marcada «(inf.)» porque se infiere del codename.');

  const byVer = bucketBy(ids, i => RD.vers[R_ver[i]]);
  const vr = [...byVer.entries()].map(([v, a]) => ({ v, s: statOf(a) }))
    .filter(r => r.s.n >= 60 && r.v).sort((a, b) => a.v.localeCompare(b.v, undefined, { numeric: true }));
  if (vr.length) L.push('POR VERSIÓN (n>=60): ' + vr.map(r =>
    r.v + ' n=' + nf(r.s.n) + ' media=' + star(r.s.avg) + ' 1-2★=' + rpct(r.s.bad)).join(' | '));

  const marked = [];
  bucketBy(ids, i => RD.devs[R_dev[i]]).forEach((a, d) => {
    const s2 = statOf(a); if (s2.n < 30) return;
    const ci = wilson(a[0] + a[1], s2.n);
    if (ci[0] * 100 > st.bad) marked.push(d + ' (n=' + nf(s2.n) + ', 1-2★=' + rpct(s2.bad)
      + ', IC95 ' + nf(ci[0] * 100, 1) + '-' + nf(ci[1] * 100, 1) + '%)');
  });
  L.push('MODELOS PEORES QUE LA MEDIA con el intervalo de Wilson al 95 % entero por encima del '
    + rpct(st.bad) + ' global (solo n>=30): ' + (marked.length ? marked.sort().join('; ') : 'ninguno'));
  return { ids, st };
}
function briefReviews(L) {
  const ids = rSel();
  const fText = ids.filter(i => R_text[i] >= 0);
  const fCont = fText.filter(i => RD.rev[R_text[i]].k);
  const fTopic = fCont.filter(i => RD.rev[R_text[i]].g.some(x => x !== 'praise'));
  const fFric = fTopic.filter(i => RD.rev[R_text[i]].w);
  L.push('');
  L.push('EMBUDO DE LA VOZ (cada paso es subconjunto del anterior): '
    + nf(ids.length) + ' valoraciones -> ' + nf(fText.length) + ' con texto -> '
    + nf(fCont.length) + ' con contenido (no ruido ni nombre propio) -> '
    + nf(fTopic.length) + ' con tema de producto -> ' + nf(fFric.length) + ' con fricción declarada.');

  const tis = rSelText({ topic: 1, sent: 1 });
  if (!tis.length) { L.push('SIN REVIEWS CON TEXTO en este corte.'); return; }
  const tc = {}, ts = {};
  tis.forEach(ti => {
    const sg = signOf(R_rat[RD.rev[ti].n]);
    RD.rev[ti].g.forEach(g => {
      if (g === 'praise') return;
      tc[g] = (tc[g] || 0) + 1;
      ts[g] = ts[g] || { neg: 0, neu: 0, pos: 0 }; ts[g][sg]++;
    });
  });
  const order = Object.keys(tc).sort((a, b) => tc[b] - tc[a]);
  L.push('TEMAS con el signo de la nota con que se mencionan (una review puede llevar varios):');
  order.forEach(g => L.push('  · ' + TOPIC[g] + ': ' + nf(tc[g]) + ' menciones — '
    + nf(ts[g].neg) + ' de 1-2★ (' + rpct(ts[g].neg / tc[g] * 100, 0) + '), '
    + nf(ts[g].neu) + ' de 3★, ' + nf(ts[g].pos) + ' de 4-5★'));

  const base = {};
  tis.forEach(ti => { const l = RD.langs[R_lang[RD.rev[ti].n]]; base[l] = (base[l] || 0) + 1; });
  const cols = TOP_LANGS.filter(l => (base[l] || 0) >= 30);
  if (cols.length) {
    L.push('TEMAS CRITICADOS (1-2★) POR IDIOMA, en % de las reviews de ese idioma:');
    cols.forEach(l => {
      const mine = tis.filter(ti => RD.langs[R_lang[RD.rev[ti].n]] === l
        && signOf(R_rat[RD.rev[ti].n]) === 'neg');
      const cnt = {};
      mine.forEach(ti => RD.rev[ti].g.forEach(g => { if (g !== 'praise') cnt[g] = (cnt[g] || 0) + 1; }));
      const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 4);
      L.push('  · ' + l + ' (base ' + nf(base[l]) + '): '
        + (top.length ? top.map(g => TOPIC[g] + ' ' + rpct(cnt[g] / base[l] * 100)).join(', ') : 'ninguno'));
    });
  }
  const sc = {};
  tis.forEach(ti => { sc[RD.rev[ti].s] = (sc[RD.rev[ti].s] || 0) + 1; });
  L.push('SENTIMIENTO DEL TEXTO (calculado del texto con un léxico, NO de la estrella): '
    + SENTS.map(x => x.label + ' ' + nf(sc[x.id] || 0)).join(', ') + '.');
  /* El cruce sentimiento × estrella salió del panel, así que su cifra sale
     también del brief: la regla es que aquí no viaja nada que no esté en
     pantalla. El reparto de sentimiento se queda porque es la descomposición
     del KPI «Balance de sentimiento», que sí se muestra. */

  /* Verbatims: el dato en crudo que está en la lista de la vista. Se manda una
     muestra corta, priorizando lo que trae señal, para que la lectura pueda
     citar en lugar de generalizar. */
  const pick = tis.slice()
    .filter(ti => RD.rev[ti].k && RD.rev[ti].g.some(g => g !== 'praise'))
    .sort((a, b) => (R_rat[RD.rev[a].n] - R_rat[RD.rev[b].n])
      || (RD.rev[b].x.length - RD.rev[a].x.length))
    .slice(0, 24);
  if (pick.length) {
    L.push('');
    L.push('MUESTRA DE ' + pick.length + ' REVIEWS (las de peor nota con tema identificado; texto literal del usuario):');
    pick.forEach(ti => {
      const r = RD.rev[ti], i = r.n;
      L.push('  [' + R_rat[i] + '★ ' + RD.langs[R_lang[i]] + ' ' + RD.devs[R_dev[i]]
        + ' ' + (RD.vers[R_ver[i]] || 'sin versión') + ' ' + RD.days[R_day[i]] + '] '
        + r.x.replace(/\s+/g, ' ').slice(0, 220));
    });
  }
}

const CTX_VIEWS = {
  resumen: () => { const L = briefHead(); briefRatings(L); briefReviews(L); return L.join('\n'); },
  rating:  () => { const L = briefHead(); briefRatings(L); return L.join('\n'); },
  reviews: () => { const L = briefHead(); briefRatings(L, true); briefReviews(L); return L.join('\n'); },
};

/* Las instrucciones van en el prompt porque `sample` no tiene memoria ni
   system prompt que la página controle: cada llamada ve solo esto. */
function ctxPrompt(view) {
  const lang = LANG === 'es'
    ? 'Responde en español de España.'
    : 'Answer in English (British spelling).';
  return [
    'Eres analista de producto y CRO. Te doy el brief de datos EXACTO que un panel está mostrando ahora mismo.',
    '',
    'REGLAS, sin excepción:',
    '1. Usa SOLO las cifras del brief. No inventes ni estimes ninguna que no esté.',
    '2. Cita la cifra concreta en cada afirmación.',
    '3. No afirmes tendencias temporales: la muestra viene en lotes de cobertura desigual.',
    '4. Si una base es pequeña (n < 30), dilo en vez de concluir.',
    '5. Distingue tasa de volumen: no los mezcles en la misma frase como si fueran lo mismo.',
    '6. Nada de relleno, ni resumir lo que el panel ya dice: ve a qué significa y qué haría.',
    '7. ' + lang,
    '',
    'Devuelve SOLO un array JSON de 3 a 5 objetos, ordenados por lo que atendería primero:',
    '[{"what":"titular de 4-9 palabras","why":"una frase con la cifra que lo sostiene","why2":"qué haría, concreto y medible"}]',
    '',
    '--- BRIEF DE DATOS ---',
    CTX_VIEWS[view](),
  ].join('\n');
}

/* ------------------------------------------------------------- la tarjeta */
function copyToClipboard(text, okFn, failFn) {
  const done = ok => (ok ? okFn : failFn)();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
      return;
    }
  } catch (e) { /* contexto sin permiso de portapapeles */ }
  done(false);
}

function ctxItems(data) {
  /* Se acepta lo que venga: array de objetos, array de cadenas o un objeto
     con una lista dentro. Lo que no encaje se muestra como texto. */
  const arr = Array.isArray(data) ? data
    : (data && Array.isArray(data.items) ? data.items : null);
  if (!arr) return null;
  const out = arr.map(x => typeof x === 'string'
    ? { what: x, why: '' }
    : { what: String(x.what ?? x.title ?? ''), why: String(x.why ?? x.detail ?? ''), why2: x.why2 ? String(x.why2) : '' })
    .filter(x => x.what || x.why);
  return out.length ? out : null;
}

function contextCard(view) {
  const c = card('c12', 'ctx');
  mod(c, 'ctx', t('Lectura de IA'));
  const key = ctxKey(view);
  const controls = E('div', 'ctxbtns');
  const run = E('button', 'mini prim', t('Ejecutar contexto'));
  run.type = 'button'; run.disabled = true;
  const copy = E('button', 'mini', t('Copiar prompt'));
  copy.type = 'button';
  const show = E('button', 'mini', t('Ver prompt'));
  show.type = 'button'; show.setAttribute('aria-pressed', 'false');
  controls.appendChild(run); controls.appendChild(copy); controls.appendChild(show);
  head(c, t('Lectura de IA'), t('no se genera nada hasta que la pides · {n} caracteres de datos',
    { n: nf(ctxPrompt(view).length) }), controls);

  const body = E('div');
  c.appendChild(body);
  const status = E('p', 'ctxstatus');
  c.appendChild(status);

  /* el prompt, siempre a la vista si se quiere: nada se envía a ciegas */
  const pre = E('textarea', 'ctxpre');
  pre.readOnly = true; pre.hidden = true; pre.rows = 14;
  pre.value = ctxPrompt(view);
  pre.setAttribute('aria-label', t('Prompt que se enviaría'));
  c.appendChild(pre);
  show.addEventListener('click', () => {
    pre.hidden = !pre.hidden;
    show.setAttribute('aria-pressed', String(!pre.hidden));
    show.textContent = pre.hidden ? t('Ver prompt') : t('Ocultar prompt');
  });
  copy.addEventListener('click', () => {
    copyToClipboard(ctxPrompt(view),
      () => { status.textContent = t('Prompt copiado. Pégalo en Claude y trae la respuesta con «Pegar respuesta».'); },
      () => { pre.hidden = false; pre.select(); show.setAttribute('aria-pressed', 'true'); show.textContent = t('Ocultar prompt');
              status.textContent = t('El navegador no deja copiar desde aquí: el prompt está seleccionado abajo, cópialo con Cmd+C.'); });
  });

  const render = items => {
    body.textContent = '';
    const rc = readCard(t('Lectura de IA sobre este corte'), items);
    rc.className = 'read c12 ai';
    body.appendChild(rc);
    const foot = E('p', 'ctxfoot');
    foot.textContent = t('Escrito por Claude a partir del brief de datos de este corte. Contrástalo con las tarjetas: si una cifra no cuadra, manda la tarjeta.');
    body.appendChild(foot);
  };
  const cached = CTX_CACHE.get(key);
  if (cached) render(cached);

  /* pegar a mano la respuesta: el camino sin conexión */
  const paste = E('button', 'mini', t('Pegar respuesta'));
  paste.type = 'button';
  controls.appendChild(paste);
  paste.addEventListener('click', () => {
    const box = E('textarea', 'ctxpre');
    box.rows = 8;
    box.placeholder = t('Pega aquí el JSON o el texto que te haya devuelto Claude');
    box.setAttribute('aria-label', t('Respuesta de Claude'));
    const ok = E('button', 'mini prim', t('Usar esta respuesta'));
    ok.type = 'button';
    ok.addEventListener('click', () => {
      const raw = box.value.trim();
      if (!raw) return;
      let items = null;
      try {
        const m = raw.match(/[[{][\s\S]*[\]}]/);
        if (m) items = ctxItems(JSON.parse(m[0]));
      } catch (e) { items = null; }
      if (!items) items = raw.split(/\n{2,}/).map(p => ({ what: '', why: p.trim() })).filter(x => x.why);
      CTX_CACHE.set(key, items);
      render(items);
      status.textContent = '';
    });
    body.textContent = '';
    body.appendChild(box); body.appendChild(ok);
    box.focus();
  });

  /* ejecutar de verdad, cuando hay a quién preguntar */
  let ctl = null;
  const stop = E('button', 'mini', t('Detener'));
  stop.type = 'button'; stop.hidden = true;
  controls.appendChild(stop);
  stop.addEventListener('click', () => { if (ctl) ctl.abort(); });

  const ERRS = {
    not_granted: 'Has denegado el permiso, así que no se ha preguntado nada. Recarga la página si quieres volver a decidir.',
    rate_limited: 'Demasiadas peticiones seguidas. Espera un momento y vuelve a pulsar.',
    prompt_too_large: 'El brief de este corte es demasiado grande. Filtra más y vuelve a pulsar.',
    invalid_json: 'La respuesta no vino en el formato esperado. Vuelve a pulsar o usa «Pegar respuesta».',
    session_expired: 'La sesión ha caducado. Recarga la página.',
    sampling_disabled: 'Esta función está desactivada en tu cuenta.',
    empty_completion: 'La respuesta vino vacía. Vuelve a pulsar.',
  };
  run.addEventListener('click', async () => {
    if (!SAMPLER) return;
    run.disabled = true; stop.hidden = false;
    body.textContent = '';
    status.textContent = t('Pensando… puede tardar hasta un minuto. No se envía nada más que el prompt de arriba.');
    ctl = new AbortController();
    try {
      const data = await SAMPLER.json(ctxPrompt(view), {
        signal: ctl.signal, modelTier: 'default',
      });
      const items = ctxItems(data);
      if (!items) throw { code: 'invalid_json', message: 'sin items' };
      CTX_CACHE.set(key, items);
      render(items);
      status.textContent = '';
    } catch (e) {
      const code = (e && e.code) || 'upstream_error';
      if (code === 'cancelled') { status.textContent = t('Detenido. No se ha guardado nada.'); }
      else if (code === 'invalid_json' && e.text) {
        const items = [{ what: '', why: String(e.text).slice(0, 1200) }];
        CTX_CACHE.set(key, items); render(items);
        status.textContent = t('La respuesta no vino en el formato pedido; se muestra tal cual.');
      } else {
        status.textContent = t(ERRS[code] || 'No se ha podido generar la lectura ({code}).', { code });
      }
    } finally {
      run.disabled = SAMPLER_STATE !== 'ready'; stop.hidden = true; ctl = null;
    }
  });

  /* el botón se enciende cuando (y si) hay capacidad; mientras, se explica */
  const paint = () => {
    if (SAMPLER_STATE === 'ready') {
      run.disabled = false;
      run.title = t('Pregunta a Claude con tu propia cuenta; te pedirá permiso la primera vez.');
      if (!cached && !status.textContent) status.textContent = '';
    } else {
      run.disabled = true;
      run.title = t('No disponible aquí');
      if (!cached) status.textContent = t('Aquí no hay a quién preguntar (la página está abierta en local o sin la capacidad de IA). Copia el prompt, pásalo por Claude y trae la respuesta con «Pegar respuesta».');
    }
  };
  paint();
  onSampler(paint);
  return c;
}

/* ==========================================================================
   VISTA · PORTADA
   Resume las dos secciones y lleva a ellas. Lee el mismo corte que ellas, así
   que sus cifras nunca discuten con los héroes de Rating y Reviews.
   ========================================================================== */
function realModule(o) {
  const c = card(o.span);
  const b = E('button', 'mini', o.cta);
  b.type = 'button';
  b.addEventListener('click', () => selectTab(o.tab));
  head(c, o.title, o.sub, b);
  const kg = E('div');
  kg.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 20px;margin-top:2px';
  o.tiles.forEach(t => kg.appendChild(kpiTile(t)));
  c.appendChild(kg);
  if (o.note) {
    const n = E('p', '', o.note);
    n.style.cssText = 'margin:12px 0 0;font-size:12px;color:var(--ink-3);line-height:1.45';
    c.appendChild(n);
  }
  return o.key ? mod(c, o.key, o.title) : c;
}

function renderResumen(root) {
  const g = E('div', 'grid');
  const ids = rSel();

  g.appendChild(eyebrow(t('La voz del usuario · Google Play')));
  g.appendChild(srcNote(t('las dos secciones del panel, resumidas')));
  if (!ids.length) {
    g.appendChild(emptyCut(t('Ninguna valoración cumple este corte'),
      t('Amplía el rango de fechas o quita uno de los filtros de idioma, dispositivo o nota.')));
    root.appendChild(g);
    return;
  }

  const rAll = statOf(bucketBy(ids, () => 1).get(1) || BUCK());
  const tis = ids.map(i => R_text[i]).filter(t => t >= 0);
  const withContent = tis.filter(t => RD.rev[t].k);
  const action = withContent.filter(t => RD.rev[t].g.some(x => x !== 'praise'));
  const fric = action.filter(t => RD.rev[t].w);

  const fricCount = {};
  fric.forEach(t => RD.rev[t].g.forEach(x => {
    if (x !== 'praise') fricCount[x] = (fricCount[x] || 0) + 1;
  }));
  const topFric = Object.keys(fricCount).sort((a, b) => fricCount[b] - fricCount[a])[0];

  /* modelos que están peor que la media con el intervalo entero por encima */
  let badDevs = 0;
  bucketBy(ids, i => RD.devs[R_dev[i]]).forEach(a => {
    const st = statOf(a);
    if (st.n >= 30 && wilson(a[0] + a[1], st.n)[0] * 100 > rAll.bad) badDevs++;
  });

  g.appendChild(realModule({
    key: 'm-rating', span: 'c6', tab: 'rating', cta: t('Abrir Rating'),
    title: t('La nota'), sub: t('{n} valoraciones', { n: nf(rAll.n) }) + ' · ' + rCutLabel(),
    tiles: [
      { label: t('Rating medio'), value: star(rAll.avg) + ' / 5', foot: t('{p} son 5★', { p: rpct(rAll.top) }) },
      { label: t('Notas de 1★ y 2★'), value: rpct(rAll.bad), foot: t('{n} valoraciones', { n: nf(rAll.dist[0] + rAll.dist[1]) }) },
      { label: t('Modelos peores que la media'), value: nf(badDevs), foot: t('con intervalo de confianza al 95 %') },
    ],
    note: t('El desglose por idioma, versión y familia de dispositivo está en «Rating».'),
  }));
  g.appendChild(realModule({
    key: 'm-reviews', span: 'c6', tab: 'reviews', cta: t('Abrir Reviews'),
    title: t('La voz'),
    sub: t('{n} traen texto · el {p} del corte',
      { n: nf(tis.length), p: rpct(rAll.n ? tis.length / rAll.n * 100 : 0, 1) }),
    tiles: [
      { label: t('Reviews con señal'), value: nf(action.length), foot: t('con tema de producto identificado') },
      { label: t('Piden o critican algo'), value: nf(fric.length), foot: t('fricción declarada en el texto') },
      { label: t('Tema con más fricción'), value: topFric ? topicLabel(topFric) : '—',
        foot: topFric ? t('{n} menciones', { n: nf(fricCount[topFric]) }) : t('sin temas en el corte') },
    ],
    note: t('El texto es opcional en Play: el embudo completo, paso a paso, está en «Reviews».'),
  }));

  g.appendChild(eyebrow(t('Interpretación'), 'eb-ctx'));
  g.appendChild(contextCard('resumen'));

  layoutModules('resumen', g);
  root.appendChild(g);
}

</script>

<script>
/* ==========================================================================
   ENRUTADO, FILTROS Y ARRANQUE
   ========================================================================== */
const RENDERERS = { resumen: renderResumen, rating: renderRating, reviews: renderReviews };
const PANELS = { resumen: '#p-resumen', rating: '#p-rating', reviews: '#p-reviews' };
/* La barra de filtros de texto solo aplica en Reviews; la de fechas, idioma,
   dispositivo y nota aplica en las tres vistas. */

function renderActive() {
  const panel = $(PANELS[state.tab]);
  VARCACHE = {};
  /* la recarga mantiene el marco: sin esqueleto ni salto de layout */
  const old = panel.firstChild;
  if (old) old.classList.add('stale');
  const draw = () => {
    panel.textContent = '';
    try {
      RENDERERS[state.tab](panel);
    } catch (err) {
      /* Sin esto, cualquier excepción deja la pestaña en blanco sin decir nada.
         Preferimos una tarjeta con el error, que se puede leer y reportar. */
      panel.textContent = '';
      const c = card('c12');
      head(c, t('Esta vista no se ha podido pintar'), rCutLabel());
      const pm = E('p', '', String((err && err.message) || err));
      pm.style.cssText = 'margin:4px 0 0;font-size:13px;color:var(--crit);font-family:ui-monospace,Menlo,monospace';
      c.appendChild(pm);
      const pn = E('p', '', t('Es un fallo del panel, no de los datos. Prueba a restablecer los filtros; si sigue, copia este mensaje.'));
      pn.style.cssText = 'margin:8px 0 0;font-size:12.5px;color:var(--ink-3)';
      c.appendChild(pn);
      const g2 = E('div', 'grid'); g2.appendChild(c); panel.appendChild(g2);
      if (window.console) console.error('[product-lab]', err);
    }
    const st = $('#stamp');
    if (st) st.textContent = t('Google Play · {n} valoraciones · {a} – {b} de 2026',
      { n: nf(RD.meta.n), a: dmy(D_FROM), b: dmy(D_TO) });
  };
  if (old) setTimeout(draw, 16); else draw();  /* setTimeout y no rAF: la pestaña oculta también repinta */
}
function selectTab(id, focus) {
  state.tab = id;
  $$('.tab').forEach(t => {
    const on = t.dataset.tab === id;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
    $(PANELS[t.dataset.tab]).hidden = !on;
    if (on && focus) t.focus();
  });
  /* el sentimiento y el tema solo filtran texto: fuera de Reviews no aplican */
  $$('#f-real .rev-only').forEach(el => { el.hidden = id !== 'reviews'; });
  tipHide();
  renderActive();
}
$$('.tab').forEach((t, i, arr) => {
  t.addEventListener('click', () => selectTab(t.dataset.tab));
  t.addEventListener('keydown', ev => {
    const d = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : ev.key === 'Home' ? -i : ev.key === 'End' ? arr.length - 1 - i : 0;
    if (!d) return;
    ev.preventDefault();
    selectTab(arr[(i + d + arr.length) % arr.length].dataset.tab, true);
  });
});

/* ---------------------------------------------------------------------------
   Filtros de los datos reales. Los <select> se pueblan de las propias tablas
   de RD, así que no hay listas escritas a mano que se queden obsoletas.
   --------------------------------------------------------------------------- */
const rFrom = $('#r-from'), rTo = $('#r-to');
rFrom.min = rTo.min = isoOf(D_FROM); rFrom.max = rTo.max = isoOf(D_TO);
rFrom.value = isoOf(D_FROM); rTo.value = isoOf(D_TO);

const rLang = $('#r-lang');
function fillLang() {
  rLang.textContent = '';
  const counts = {};
  for (let i = 0; i < RN; i++) { const l = RD.langs[R_lang[i]]; counts[l] = (counts[l] || 0) + 1; }
  const opt = (v, t) => { const o = E('option'); o.value = v; o.textContent = t; rLang.appendChild(o); };
  opt('all', t('Todos los idiomas'));
  TOP_LANGS.forEach(l => opt(l, langName(l) + ' · ' + nf(counts[l] || 0)));
  const rest = RD.langs.slice(4).reduce((a, l) => a + (counts[l] || 0), 0);
  opt('otros', t('Resto ({k} idiomas)', { k: RD.langs.length - 4 }) + ' · ' + nf(rest));
}

const rFam = $('#r-fam');
function fillFam() {
  rFam.textContent = '';
  const counts = {};
  for (let i = 0; i < RN; i++) { const f = FAMS[R_fam[i]]; counts[f] = (counts[f] || 0) + 1; }
  const opt = (v, t) => { const o = E('option'); o.value = v; o.textContent = t; rFam.appendChild(o); };
  opt('all', t('Todos los dispositivos'));
  FAMS.filter(f => counts[f]).forEach(f => opt(f, famLabel(f) + ' · ' + nf(counts[f])));
}

/* Nota: grupos por signo primero, porque es lo que se pregunta antes («¿esto es
   queja o elogio?»), y las notas sueltas después para el que quiera afinar. */
const rRating = $('#r-rating');
function fillRating() {
  rRating.textContent = '';
  const byStar = [0, 0, 0, 0, 0];
  for (let i = 0; i < RN; i++) byStar[R_rat[i] - 1]++;
  const opt = (host, v, t) => { const o = E('option'); o.value = v; o.textContent = t; host.appendChild(o); };
  opt(rRating, 'all', t('Todas las notas') + ' · ' + nf(RN));
  const grp = (label) => { const g = document.createElement('optgroup'); g.label = label; rRating.appendChild(g); return g; };
  const g1 = grp(t('Por signo'));
  SIGNS.forEach(x => {
    const n = byStar.reduce((a, c, k) => a + (x.has(k + 1) ? c : 0), 0);
    opt(g1, x.id, signLabel(x.id) + ' · ' + nf(n));
  });
  const g2 = grp(t('Una sola nota'));
  [5, 4, 3, 2, 1].forEach(k => opt(g2, String(k), k + '★ · ' + nf(byStar[k - 1])));
}

const rSent = $('#r-sent');
function fillSent() {
  rSent.textContent = '';
  const opt = (v, t) => { const o = E('option'); o.value = v; o.textContent = t; rSent.appendChild(o); };
  opt('all', t('Cualquier sentimiento'));
  SENTS.forEach(x => opt(x.id, sentLabel(x.id)));
}

const rTopic = $('#r-topic');
function fillTopic() {
  rTopic.textContent = '';
  const counts = {};
  RD.rev.forEach(r => r.g.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const opt = (v, t) => { const o = E('option'); o.value = v; o.textContent = t; rTopic.appendChild(o); };
  opt('all', t('Todos los temas'));
  RD.meta.topics.map(x => x.id).filter(x => counts[x])
    .sort((a, b) => counts[b] - counts[a])
    .forEach(x => opt(x, topicLabel(x) + ' · ' + nf(counts[x])));
}

/* Rellena los cinco desplegables y les devuelve el valor que estaba puesto.
   Se llama al arrancar y cada vez que cambia el idioma. */
function fillFilters() {
  fillLang(); fillFam(); fillRating(); fillSent(); fillTopic();
  rLang.value = rstate.lang; rFam.value = rstate.fam; rRating.value = rstate.rating;
  rSent.value = rstate.sent; rTopic.value = rstate.topic;
}
fillFilters();

function rChanged() { rstate.limit = 40; renderActive(); }
rFrom.addEventListener('change', () => {
  if (!rFrom.value) { rFrom.value = isoOf(D_FROM); }
  rstate.from = Math.max(D_FROM, Math.min(numOf(rFrom.value), rstate.to));
  rFrom.value = isoOf(rstate.from); rChanged();
});
rTo.addEventListener('change', () => {
  if (!rTo.value) { rTo.value = isoOf(D_TO); }
  rstate.to = Math.min(D_TO, Math.max(numOf(rTo.value), rstate.from));
  rTo.value = isoOf(rstate.to); rChanged();
});
rLang.addEventListener('change', () => { rstate.lang = rLang.value; rChanged(); });
rFam.addEventListener('change', () => { rstate.fam = rFam.value; rChanged(); });
rSent.addEventListener('change', () => { rstate.sent = rSent.value; rChanged(); });
rTopic.addEventListener('change', () => { rstate.topic = rTopic.value; rChanged(); });
$('#r-content').addEventListener('change', ev => { rstate.content = ev.target.checked; rChanged(); });
$('#r-fric').addEventListener('change', ev => { rstate.fric = ev.target.checked; rChanged(); });
rRating.addEventListener('change', () => { rstate.rating = rRating.value; rChanged(); });
$('#r-order').addEventListener('click', () => {
  clearOrder(state.tab);
  renderActive();
});
$('#r-reset').addEventListener('click', () => {
  Object.assign(rstate, { from: D_FROM, to: D_TO, lang: 'all', fam: 'all', rating: 'all',
                          sent: 'all', topic: 'all', content: true, fric: false, sort: 'recent',
                          limit: 40, grain: 'week' });
  rFrom.value = isoOf(D_FROM); rTo.value = isoOf(D_TO);
  rLang.value = 'all'; rFam.value = 'all'; rSent.value = 'all'; rTopic.value = 'all';
  rRating.value = 'all';
  $('#r-content').checked = true; $('#r-fric').checked = false;
  renderActive();
});

/* ==========================================================================
   PUERTA DE ACCESO
   Es un cierre de cortesía, no seguridad, y la propia pantalla lo dice: la
   página es un fichero estático, así que quien abra el código fuente tiene los
   datos delante sin pasar por aquí. Lo que sí hace:
   · mantiene fuera a la visita casual que llega por el enlace;
   · no lleva la contraseña en claro (se compara un SHA-256 con sal), así que no
     se encuentra buscando la palabra en el fuente;
   · no pinta el panel hasta abrirse, así que ni se renderiza ni se puede tabular.
   El SHA-256 va implementado a mano y no con WebCrypto porque `crypto.subtle`
   exige contexto seguro y esto tiene que seguir funcionando con `open index.html`.
   ========================================================================== */
const GATE_SALT = 'bsp$';
const GATE_HASH = 'e0af6b5aa5737c110804d7f94fbad3781a5c92f206057276ca828df9abec8533';
const GATE_FLAG = 'bsp-unlocked';

function sha256Hex(str) {
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  /* UTF-8 a mano: la contraseña puede llevar acentos */
  const bytes = [];
  for (const ch of str) {
    let c = ch.codePointAt(0);
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0 | c >> 6, 0x80 | c & 63);
    else if (c < 0x10000) bytes.push(0xe0 | c >> 12, 0x80 | (c >> 6) & 63, 0x80 | c & 63);
    else bytes.push(0xf0 | c >> 18, 0x80 | (c >> 12) & 63, 0x80 | (c >> 6) & 63, 0x80 | c & 63);
  }
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(Math.floor(bitLen / Math.pow(2, i * 8)) & 255);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const w = new Uint32Array(64);
  for (let off = 0; off < bytes.length; off += 64) {
    for (let i = 0; i < 16; i++) {
      w[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16)
        | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
    }
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = [(H[0] + a) >>> 0, (H[1] + b) >>> 0, (H[2] + c) >>> 0, (H[3] + d) >>> 0,
         (H[4] + e) >>> 0, (H[5] + f) >>> 0, (H[6] + g) >>> 0, (H[7] + h) >>> 0];
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}

const gateOk = pw => sha256Hex(GATE_SALT + pw) === GATE_HASH;
function gateUnlocked() {
  try { return localStorage.getItem(GATE_FLAG) === GATE_HASH; } catch (e) { return false; }
}
function gateRemember() {
  try { localStorage.setItem(GATE_FLAG, GATE_HASH); } catch (e) { /* sin storage: se pide cada vez */ }
}
function gateForget() {
  try { localStorage.removeItem(GATE_FLAG); } catch (e) { /* ídem */ }
}

/* ---------------------------------------------------------------------------
   Idioma. Cambiar de idioma toca tres cosas: el marco estático (marcado con
   data-i18n en el HTML), los desplegables (sus etiquetas se generan) y el
   render. Los formateadores de número se rehacen en setLocale().
   --------------------------------------------------------------------------- */
function applyStaticI18n() {
  document.documentElement.setAttribute('lang', LANG);
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  const lb = $('#lang');
  lb.textContent = LANG === 'es' ? 'EN' : 'ES';
  lb.title = LANG === 'es' ? 'Switch to English' : 'Cambiar a español';
  const rc = $('#ratcount'), vc = $('#revcount');
  if (rc) rc.textContent = compact(RD.meta.n);
  if (vc) vc.textContent = nf(RD.meta.n_text);
  $('#foot').textContent = t('BeSoccer Product Lab · v0.5 · Todas las cifras vienen de Google Play: {n} valoraciones y {x} reviews con texto, entre el {a} y el {b} de 2026. La recolección llegó en {k} lotes de cobertura desigual, así que el panel no dibuja tendencias semanales; ver «Calidad de la muestra» en Rating. El sentimiento y los temas se etiquetan con un léxico multiidioma reproducible (tools/reviews_build.py), no con un modelo: es auditable y determinista. Design system BeSoccer: verde #3B811F, Asap Condensed. Paleta de series validada para daltonismo (protan/deutan).',
    { n: nf(RD.meta.n), x: nf(RD.meta.n_text), a: dmy(D_FROM), b: dmy(D_TO), k: RD.meta.batches.length });
}
$('#lang').addEventListener('click', () => {
  setLocale(LANG === 'es' ? 'en' : 'es');
  try { localStorage.setItem('bsp-lang', LANG); } catch (e) { /* sin storage: no se recuerda entre visitas */ }
  applyStaticI18n();
  fillFilters();
  renderActive();
});

/* tema */
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur !== 'light' : true;      /* sin atributo puesto: oscuro */
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  VARCACHE = {};
  renderActive();
});

/* El logo de la puerta es el mismo asset que el de la barra: se copia en vez de
   incrustarlo dos veces, para no duplicar 5 KB de base64 en el fichero. */
(() => {
  const a = $('#logo'), b = $('#gate-logo');
  if (a && b) { b.src = a.getAttribute('src'); b.width = a.width; b.height = a.height; }
})();

const gate = $('#gate'), gateForm = $('#gate-form'), gatePw = $('#gate-pw'), gateErr = $('#gate-err');
function openApp() {
  document.body.classList.remove('locked');
  if (gate) gate.hidden = true;
  applyStaticI18n();
  selectTab('resumen');
}
if (gateForm) {
  gateForm.addEventListener('submit', ev => {
    ev.preventDefault();
    if (gateOk(gatePw.value)) { gateRemember(); openApp(); return; }
    gateErr.textContent = t('Contraseña incorrecta.');
    gatePw.value = '';
    gatePw.focus();
  });
}
$('#lock').addEventListener('click', () => {
  gateForget();
  location.reload();
});

applyStaticI18n();          /* la puerta también va traducida */
if (gateUnlocked() || !gate) {
  openApp();
} else {
  document.body.classList.add('locked');
  gate.hidden = false;
  if (gatePw) gatePw.focus();
}
</script>
