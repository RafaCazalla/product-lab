<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeSoccer Product Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600&family=Asap+Condensed:wght@500;600;700&display=swap">
<style>
/* ============================================================
   BeSoccer Product Lab — tokens
   Extraídos del design system de producción de besoccer.com:
   verde #3B811F (color dominante), tinta #383838, plano #ECECEC,
   hairline #E1E1E1, tipografía Asap Condensed.
   Series de datos: derivadas de esa base y validadas para
   daltonismo (protan/deutan, ΔE OKLab adyacente ≥ 8).
   ============================================================ */
/* Tema oscuro por defecto: es un panel de gráficas y se usa a pantalla
   completa. El claro sigue estando a un clic, en el botón «Tema».
   Los dos ámbitos definen la paleta ENTERA, nunca a medias: quien no ha
   elegido tema recibe el oscuro completo desde `:root`. Ya no se consulta
   `prefers-color-scheme`: «por defecto» significa oscuro para todos. */
:root {
  color-scheme: dark;
  --plane:      #0e100c;
  --card:       #1b1e1a;
  --sunken:     #22261f;
  --ink:        #f0f3ea;
  --ink-2:      #b3bba9;
  --ink-3:      #868e7e;
  --hair:       #2b2f27;
  --hair-2:     #3a3f35;
  --brand:      #57a52e;
  --brand-hi:   #6bbc3f;
  --brand-wash: rgba(87,165,46,.14);
  --on-brand:   #0e1a06;
  --bar:        #101208;
  --bar-ink:    #f0f3ea;

  --grid:       #272b23;
  --axis:       #3a3f35;
  --deemph:     #4a5044;

  /* categóricas — orden fijo, nunca ciclado. Validada:
     python3 tools/validate_palette.py "#57a52e,#2f95cf,#d9515f,#9179e0,#b98d16,#23a9aa" dark "#1b1e1a" */
  --s1: #57a52e; --s2: #2f95cf; --s3: #d9515f;
  --s4: #9179e0; --s5: #b98d16; --s6: #23a9aa;

  /* secuencial — un solo tono, oscuro→claro */
  --q1: #1e3c12; --q2: #2d5a1c; --q3: #3e7a29;
  --q4: #508c3c; --q5: #619e4e; --q6: #86c572;

  /* ordinal — pasos discretos ordenados (embudos) */
  --o1: #8ccb78; --o2: #77b563; --o3: #619e4e; --o4: #4d8938; --o5: #387422;

  /* divergente — polos frío/cálido + gris neutro al centro */
  --div-pos: #2f95cf; --div-neg: #d9515f; --div-mid: #2f342b;

  /* estado — sólo en texto y pastillas, siempre con icono + etiqueta */
  --good: #6bbc3f; --warn: #d8a10c; --crit: #e8707c;
  --good-wash: rgba(107,188,63,.14); --warn-wash: rgba(216,161,12,.14); --crit-wash: rgba(232,112,124,.14);

  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --r: 3px;
}
/* El botón «Tema» pone este atributo: es la única forma de salir del oscuro. */
:root[data-theme="light"] {
  color-scheme: light;
  --plane:      #eceee8;
  --card:       #ffffff;
  --sunken:     #f6f7f3;
  --ink:        #21261e;
  --ink-2:      #5c6357;
  --ink-3:      #8b9285;
  --hair:       #e1e4da;
  --hair-2:     #cfd4c6;
  --brand:      #3b811f;
  --brand-hi:   #4a9a29;
  --brand-wash: #eef6e9;
  --on-brand:   #ffffff;
  --bar:        #21261e;
  --bar-ink:    #f4f6ef;

  --grid:       #e6e9df;
  --axis:       #cfd4c6;
  --deemph:     #bcc2b3;

  /* categóricas — orden fijo, nunca ciclado. Validada:
     python3 tools/validate_palette.py "#3b811f,#0479b2,#bd2f42,#7756d0,#d8a10c,#18a0a1" light "#ffffff" */
  --s1: #3b811f; --s2: #0479b2; --s3: #bd2f42;
  --s4: #7756d0; --s5: #d8a10c; --s6: #18a0a1;

  /* secuencial — un solo tono, claro→oscuro */
  --q1: #eaf4e3; --q2: #cbe6bd; --q3: #9bd38a;
  --q4: #70a65f; --q5: #4a7d38; --q6: #285b14;

  /* ordinal — pasos discretos ordenados (embudos) */
  --o1: #85bc74; --o2: #70a65f; --o3: #5b904b; --o4: #4a7d38; --o5: #285b14;

  /* divergente — polos frío/cálido + gris neutro al centro */
  --div-pos: #0479b2; --div-neg: #bd2f42; --div-mid: #e6e9df;

  /* estado — sólo en texto y pastillas, siempre con icono + etiqueta */
  --good: #2c6b17; --warn: #8a5e00; --crit: #a52334;
  --good-wash: #eaf4e3; --warn-wash: #fbf3dd; --crit-wash: #fbe9eb;

  --shadow: 0 1px 2px rgba(33,38,30,.06), 0 1px 0 rgba(33,38,30,.03);
  --r: 3px;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 400 14px/1.45 Asap, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-family: "Asap Condensed", Asap, system-ui, sans-serif; margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-hi); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- marcador superior (scoreboard) ---------- */
.bar {
  background: var(--bar); color: var(--bar-ink);
  padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-family: "Asap Condensed", sans-serif; }
.brand .bs { display: block; height: 22px; width: auto; }
.brand .sep { width: 1px; height: 18px; background: rgba(255,255,255,.22); }
.brand .app { font-weight: 500; font-size: 15px; opacity: .82; letter-spacing: .3px; text-transform: uppercase; }
.bar .spacer { flex: 1; }
.bar .meta { font-size: 12px; opacity: .6; font-variant-numeric: tabular-nums; }
.ghost {
  background: transparent; border: 1px solid rgba(255,255,255,.2); color: inherit;
  border-radius: var(--r); padding: 4px 9px; font-size: 12.5px; cursor: pointer;
}
.ghost:hover { background: rgba(255,255,255,.09); }

/* ---------- pestañas ---------- */
.tabs {
  background: var(--card); border-bottom: 1px solid var(--hair);
  display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; scrollbar-width: thin;
  position: sticky; top: 0; z-index: 30;
}
.tab {
  background: none; border: 0; border-bottom: 3px solid transparent; cursor: pointer;
  font-family: "Asap Condensed", sans-serif; font-weight: 600; font-size: 15px;
  letter-spacing: .2px; text-transform: uppercase; color: var(--ink-2);
  padding: 12px 13px 9px; white-space: nowrap;
}
.tab:hover { color: var(--ink); background: var(--sunken); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.tab .n { font-size: 11px; color: var(--ink-3); margin-left: 5px; font-variant-numeric: tabular-nums; }

/* ---------- fila de filtros ---------- */
.filters {
  background: var(--card); border-bottom: 1px solid var(--hair);
  padding: 10px 20px; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
  position: sticky; top: 44px; z-index: 20;
}
.fgroup { display: flex; align-items: center; gap: 7px; }
.flabel {
  font-family: "Asap Condensed", sans-serif; font-size: 11.5px; font-weight: 600;
  letter-spacing: .7px; text-transform: uppercase; color: var(--ink-3);
}
select {
  background: var(--card); border: 1px solid var(--hair-2); border-radius: var(--r);
  padding: 5px 8px; cursor: pointer;
}
.switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.switch input { appearance: none; width: 32px; height: 18px; border-radius: 9px; background: var(--hair-2); position: relative; cursor: pointer; transition: background .14s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); transition: transform .14s; }
.switch input:checked { background: var(--brand); }
.switch input:checked::after { transform: translateX(14px); }
.reset { background: none; border: 0; color: var(--ink-3); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.reset:hover { color: var(--ink); }

/* ---------- rejilla ---------- */
main { padding: 18px 20px 56px; max-width: 1560px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 14px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
.c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; }
.c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
@media (max-width: 1180px) { .c3,.c4,.c5 { grid-column: span 6; } .c7,.c8,.c9 { grid-column: span 12; } }
@media (max-width: 720px)  { .grid > * { grid-column: span 12 !important; } main { padding: 14px 12px 40px; } .filters { top: 41px; padding: 9px 12px; } }

.card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px 16px; min-width: 0; }
.card.plot { display: flex; flex-direction: column; gap: 10px; }
.chead { display: flex; align-items: flex-start; gap: 10px; }
.chead h3 { font-size: 15.5px; font-weight: 600; letter-spacing: .1px; line-height: 1.2; }
.chead p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-3); }
.chead .spacer { flex: 1; }
.mini { background: var(--card); border: 1px solid var(--hair-2); border-radius: var(--r); color: var(--ink-2); font-size: 11.5px; padding: 3px 7px; cursor: pointer; white-space: nowrap; }
.mini:hover { background: var(--sunken); color: var(--ink); }
.mini[aria-pressed="true"] { background: var(--sunken); color: var(--ink); border-color: var(--hair-2); font-weight: 600; }

/* eyebrow: sólo donde marca sección real */
.eyebrow { font-family: "Asap Condensed", sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; margin: 6px 0 -2px; }
.eyebrow::before { content: ""; width: 3px; height: 13px; background: var(--brand); }
.eyebrow .rule { flex: 1; height: 1px; background: var(--hair); }

/* ---------- héroe + KPI ---------- */
.hero { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(0,1fr); gap: 20px; align-items: end; }
@media (max-width: 520px) { .hero { grid-template-columns: 1fr; } }
.hero .fig { font-family: "Asap Condensed", sans-serif; font-size: 54px; font-weight: 700; line-height: .95; letter-spacing: -1px; white-space: nowrap; }
.hero .lbl { font-size: 13px; color: var(--ink-2); }
.hero .side { font-size: 12.5px; color: var(--ink-3); }
.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .lbl { font-size: 12.5px; color: var(--ink-2); }
.kpi .val { font-family: "Asap Condensed", sans-serif; font-size: 27px; font-weight: 700; line-height: 1.05; letter-spacing: -.3px; white-space: nowrap; }
.kpi .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.delta { font-size: 12.5px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 4px; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); } .delta.down { color: var(--crit); } .delta.flat { color: var(--ink-3); }
.delta .vs { font-weight: 400; color: var(--ink-3); }

/* ---------- pastillas ---------- */

/* ---------- leyenda ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; border-radius: 1px; }
.legend i.rect { width: 10px; height: 10px; }
.legend i.line { width: 14px; height: 2px; border-radius: 2px; }

/* ---------- tablas ---------- */
.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 6px 9px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th {
  font-family: "Asap Condensed", sans-serif; font-size: 11.5px; font-weight: 600;
  letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 1px solid var(--hair-2); position: sticky; top: 0; background: var(--card);
}
tbody td { font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--sunken); }
tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--hair-2); font-variant-numeric: tabular-nums; }
td .name { display: inline-flex; align-items: center; gap: 7px; }
td .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.meter { display: block; height: 6px; background: var(--sunken); border-radius: 2px; overflow: hidden; min-width: 64px; }
.meter i { display: block; height: 100%; background: var(--q4); }

/* ---------- lectura de producto ---------- */
.read { background: var(--card); border: 1px solid var(--hair); border-left: 3px solid var(--brand); border-radius: var(--r); padding: 13px 16px; }
.read h4 { font-size: 14px; margin-bottom: 8px; }
.read ol { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 13.2px; color: var(--ink-2); }
.read ol strong { color: var(--ink); font-weight: 600; }
.read .why { color: var(--ink-3); }

/* ---------- gráficas ---------- */
.plotbox { position: relative; }
.plotbox svg { display: block; width: 100%; height: auto; }
svg text { font-family: Asap, system-ui, sans-serif; }
.tick { font-size: 11px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.dlabel { font-size: 12px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
.dlabel.sec { font-weight: 400; fill: var(--ink-3); }
.hit { fill: transparent; cursor: crosshair; }
.hit:focus { outline: none; }
.cellhit { cursor: default; }
.stale { opacity: .38; transition: opacity .12s; }

#tip {
  position: fixed; z-index: 90; pointer-events: none; opacity: 0;
  background: var(--card); color: var(--ink); border: 1px solid var(--hair-2);
  border-radius: var(--r); box-shadow: 0 6px 18px rgba(33,38,30,.16);
  padding: 8px 10px; font-size: 12.5px; min-width: 130px; transition: opacity .1s;
}
#tip.on { opacity: 1; }
#tip .th { font-family: "Asap Condensed", sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
#tip .tr { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
#tip .tk { width: 12px; height: 2px; border-radius: 2px; flex: none; }
#tip .tv { font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .tn { color: var(--ink-3); margin-left: auto; }
footer { padding: 0 20px 28px; max-width: 1560px; margin: 0 auto; color: var(--ink-3); font-size: 12px; }

/* --- puerta de acceso ---
   Mientras está echada, el resto del documento no se pinta ni se puede
   tabular: el panel no se renderiza hasta que se abre. */
body.locked > *:not(#gate) { display: none !important; }
#gate {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: var(--plane); padding: 24px;
}
#gate[hidden] { display: none; }
.gatebox {
  width: 100%; max-width: 380px; background: var(--card);
  border: 1px solid var(--hair); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 28px 26px 24px; text-align: left;
}
.gatebox img { display: block; height: 26px; width: auto; margin-bottom: 22px; }
.gatebox h1 {
  font-family: "Asap Condensed", Asap, system-ui, sans-serif;
  font-size: 21px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.2px;
}
.gatebox p { margin: 0 0 18px; font-size: 13px; color: var(--ink-3); line-height: 1.45; }
.gatebox label { display: block; font-family: "Asap Condensed", sans-serif; font-size: 11.5px;
  font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.gatebox input {
  width: 100%; background: var(--sunken); color: var(--ink);
  border: 1px solid var(--hair-2); border-radius: var(--r);
  padding: 9px 11px; font-size: 15px;
}
.gatebox input:focus-visible { outline: 2px solid var(--brand-hi); outline-offset: 1px; }
.gatebox button {
  margin-top: 14px; width: 100%; background: var(--brand); color: var(--on-brand);
  border: 1px solid var(--brand); border-radius: var(--r);
  padding: 9px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.gatebox button:hover { background: var(--brand-hi); border-color: var(--brand-hi); }
.gateerr { margin: 12px 0 0; font-size: 12.5px; color: var(--crit); min-height: 1.2em; }
.gatefoot { margin: 18px 0 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

/* --- módulos movibles: pinza centrada en el borde superior --- */
.mod { position: relative; }
.grip {
  position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
  width: 36px; height: 15px; padding: 0; line-height: 13px;
  background: var(--card); border: 1px solid var(--hair-2); border-radius: 8px;
  color: var(--ink-3); font-size: 10px; letter-spacing: 1px; cursor: grab;
  opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 5;
}
.mod:hover > .grip, .grip:focus-visible { opacity: 1; pointer-events: auto; }
.grip:hover { color: var(--ink); border-color: var(--hair-2); background: var(--sunken); }
.grip:active { cursor: grabbing; }
.mod.dragging { opacity: .38; }
.mod.dragover-before { box-shadow: -3px 0 0 var(--brand), var(--shadow); }
.mod.dragover-after { box-shadow: 3px 0 0 var(--brand), var(--shadow); }
@media (prefers-reduced-motion: reduce) { .grip { transition: none; } }

/* --- titular calculado: el hallazgo en palabras, recalculado con el corte --- */
.insight { margin: 0; font-size: 13.5px; line-height: 1.4; font-weight: 600; color: var(--ink); }

/* --- lectura de IA bajo demanda --- */
.card.ctx { display: flex; flex-direction: column; gap: 10px; }
.ctxbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.mini.prim { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
.mini.prim:hover { background: var(--brand-hi); border-color: var(--brand-hi); color: var(--on-brand); }
.mini:disabled { opacity: .45; cursor: not-allowed; }
.mini:disabled:hover { background: var(--card); color: var(--ink-2); }
.ctxstatus:empty { display: none; }
.ctxstatus { margin: 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.45; max-width: 78ch; }
.ctxpre {
  width: 100%; font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--sunken); color: var(--ink-2); border: 1px solid var(--hair-2);
  border-radius: var(--r); padding: 9px 11px; resize: vertical;
}
.read.ai { border-left-color: var(--s4); }
.ctxfoot { margin: 8px 0 0; font-size: 12px; color: var(--ink-3); line-height: 1.45; max-width: 78ch; }

/* --- datos reales: lista de verbatims y etiquetas --- */
.srcnote { font-size: 12px; color: var(--ink-3); margin: -2px 0 2px; }
.vlist { display: flex; flex-direction: column; max-height: 620px; overflow-y: auto; }
.vrow { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 12px; padding: 11px 2px; border-top: 1px solid var(--hair); }
.vrow:first-child { border-top: 0; }
.vstars { font-family: "Asap Condensed", sans-serif; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.vmeta { font-size: 11.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 0 6px; }
.vtext { font-size: 13.5px; line-height: 1.45; margin-top: 3px; overflow-wrap: anywhere; }
.vtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.vreply { margin-top: 7px; font-size: 12.5px; color: var(--ink-3); border-left: 2px solid var(--hair-2); padding-left: 9px; line-height: 1.4; }
.filters[hidden] { display: none; }
input[type="date"] {
  background: var(--card); color: var(--ink); border: 1px solid var(--hair-2);
  border-radius: var(--r); padding: 4px 7px; font: inherit; font-size: 13px;
}
</style>

<!-- Puerta de acceso. Es un cierre de cortesía, no seguridad: ver la nota de
     la propia pantalla y el apartado «Puerta de acceso» de CLAUDE.md. -->
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-h">
  <form class="gatebox" id="gate-form" autocomplete="off">
    <img src="" id="gate-logo" alt="BeSoccer" width="339" height="66">
    <h1 id="gate-h" data-i18n="Product Lab">Product Lab</h1>
    <p data-i18n="Panel interno de la voz del usuario. Introduce la contraseña para entrar.">Panel interno de la voz del usuario. Introduce la contraseña para entrar.</p>
    <label for="gate-pw" data-i18n="Contraseña">Contraseña</label>
    <input type="password" id="gate-pw" name="pw" autocomplete="current-password"

<script>
/* ==========================================================================
   BeSoccer Product Lab — v0.5
   Panel de la voz del usuario en Google Play: la nota y las reviews.
   Sin build y sin dependencias: `open index.html` y ya. Los datos van
   incrustados abajo, en `const RD`, y los genera tools/reviews_build.py.
   ========================================================================== */

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ==========================================================================
   IDIOMA
   El español es el original y hace de clave: `t('Rating medio')` devuelve la
   traducción si existe y, si no, el propio español. Así una cadena sin traducir
   se ve en español —legible— en vez de desaparecer o mostrar una clave cruda.
   Los huecos van como {nombre} y se rellenan con el segundo argumento; nunca se
   concatena a mano alrededor de una cifra, porque el orden cambia entre idiomas.
   `tools/smoke.js` recorre las tres vistas en los dos idiomas y lista lo que
   falte en el diccionario: si añades una cadena, te enteras ahí.
   ========================================================================== */
const LANGS = { es: { name: 'Español', loc: 'es-ES' }, en: { name: 'English', loc: 'en-GB' } };
let LANG = 'es';
try { const v = localStorage.getItem('bsp-lang'); if (v && LANGS[v]) LANG = v; } catch (e) { /* sin storage: español */ }

const I18N_MISS = new Set();   /* lo consulta la prueba de humo */
function t(str, vars) {
  let out = str;
  if (LANG !== 'es') {
    const dict = I18N[LANG] || {};
    if (Object.prototype.hasOwnProperty.call(dict, str)) out = dict[str];
    else I18N_MISS.add(str);
  }
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return out;
}

/* Los formateadores dependen del idioma: en español la coma es decimal y el
   punto separa millares; en inglés al revés. Se reconstruyen al cambiar. */
let LOC = LANGS[LANG].loc;
let NF = new Intl.NumberFormat(LOC);
let NFC = {};
function setLocale(lang) {
  LANG = lang; LOC = LANGS[lang].loc;
  NF = new Intl.NumberFormat(LOC); NFC = {};
}
const nf = (v, d = 0) => (NFC[d] || (NFC[d] = new Intl.NumberFormat(LOC, { minimumFractionDigits: d, maximumFractionDigits: d }))).format(v);
const compact = (v) => v >= 1e6 ? nf(v / 1e6, v / 1e6 < 10 ? 2 : 1) + ' M'
  : v >= 1e4 ? nf(v / 1e3, 0) + ' K'
  : v >= 1e3 ? nf(v / 1e3, 1) + ' K' : nf(v, 0);
const signed = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), d);

const SVGNS = 'http://www.w3.org/2000/svg';
function S(tag, attrs = {}, kids = []) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return n;
}
function E(tag, cls, txt) { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; }
/* ---------- tooltip compartido (textContent, nunca innerHTML) ---------- */
const TIP = $('#tip');
function tipShow(x, y, title, rows) {
  TIP.textContent = '';
  const h = E('div', 'th', title); TIP.appendChild(h);
  rows.forEach(r => {
    const tr = E('div', 'tr');
    if (r.color) { const k = E('span', 'tk'); k.style.background = r.color; tr.appendChild(k); }
    tr.appendChild(E('span', 'tv', r.value));
    tr.appendChild(E('span', 'tn', r.name));
    TIP.appendChild(tr);
  });
  TIP.classList.add('on');
  const w = TIP.offsetWidth, hh = TIP.offsetHeight;
  TIP.style.left = clamp(x + 14, 8, innerWidth - w - 8) + 'px';
  TIP.style.top = clamp(y - hh - 12, 8, innerHeight - hh - 8) + 'px';
}
const tipHide = () => TIP.classList.remove('on');
addEventListener('scroll', tipHide, { passive: true });

/* ---------- montaje de gráficas responsivas ---------- */
const MOUNTED = new WeakMap();
const RO = new ResizeObserver(entries => {
  /* La redibujada se aplaza fuera del callback: mutar dentro del propio
     ResizeObserver dispara el aviso de bucle del navegador. */
  for (const en of entries) {
    const fn = MOUNTED.get(en.target);
    /* Mismo suelo que mount(): si no, el primer redibujado tras el layout puede
       entrar con una anchura que mount() nunca produce. */
    const raw = Math.round(en.contentRect.width);
    const w = Math.max(240, raw);
    if (!fn || raw <= 40 || w === fn.w) continue;
    fn.w = w;
    clearTimeout(fn.t);
    fn.t = setTimeout(() => {
      const host = en.target;
      if (MOUNTED.get(host) !== fn) return;
      host.textContent = '';
      host.appendChild(fn.draw(fn.w));
    }, 40);
  }
});
/* Desmontar antes de sustituir el contenido: si queda un redibujado
   pendiente del ResizeObserver, sobreescribiría la vista de tabla. */
function unmount(host) {
  const fn = MOUNTED.get(host);
  if (fn) clearTimeout(fn.t);
  MOUNTED.delete(host);
  RO.unobserve(host);
}
function mount(host, draw) {
  const w = Math.max(240, Math.round(host.getBoundingClientRect().width) || 480);
  MOUNTED.set(host, { draw, w });
  host.textContent = '';
  host.appendChild(draw(w));
  RO.observe(host);
  return host;
}


/* Único estado global de navegación. El corte de datos vive en `rstate`, en la
   capa de Google Play: aquí solo se recuerda qué pestaña está abierta. */
const state = { tab: 'resumen' };
</script>

<script>
/* ==========================================================================
   PRIMITIVAS DE GRÁFICA (SVG a mano, sin librerías)
   Marcas finas · rejilla hairline sólida · hueco de 2 px en color de
   superficie entre marcas · anillo de 2 px en los puntos · etiquetas
   directas selectivas · capa de hover en todas.
   ========================================================================== */
function niceTicks(min, max, count = 4) {
  if (max === min) { max = min + 1; }
  const span = max - min, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step * .001; v += step) out.push(+v.toFixed(10));
  return out;
}
/* `alt` describe el hallazgo de la gráfica completa, no una marca suelta: es
   lo que oye quien navega con lector de pantalla antes de entrar al detalle.
   Sin él, un role="img" sin nombre accesible es un hueco silencioso. */
function svgRoot(w, h, alt) {
  const s = S('svg', { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: 'img' });
  if (alt) s.setAttribute('aria-label', alt);
  s.style.width = '100%'; s.style.height = 'auto';
  return s;
}
const gridLine = (x1, x2, y) => S('line', { x1, x2, y1: y, y2: y, stroke: 'var(--grid)', 'stroke-width': 1 });
const roundTopPath = (x, y, w, h, r) => {
  r = Math.min(r, w / 2, h);
  return `M${x} ${y + h}L${x} ${y + r}Q${x} ${y} ${x + r} ${y}L${x + w - r} ${y}Q${x + w} ${y} ${x + w} ${y + r}L${x + w} ${y + h}Z`;
};
const roundRightPath = (x, y, w, h, r) => {
  r = Math.min(r, h / 2, w);
  return `M${x} ${y}L${x + w - r} ${y}Q${x + w} ${y} ${x + w} ${y + r}L${x + w} ${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}L${x} ${y + h}Z`;
};


/* ---------- barras apiladas absolutas ----------
   A diferencia de un 100 % apilado, mantiene la escala común entre filas: así
   una fila dice a la vez CUÁNTO (largo total) y DE QUÉ SIGNO (composición). Es
   la respuesta a «este tema, ¿es queja o elogio?» sin tener que mirar otra
   tarjeta. Un solo eje, hueco de 2 px en color de superficie entre segmentos. */
function stackedBarsH(cfg) {
  const fmt = cfg.fmt || (v => nf(v, 0));
  return (w) => {
    const rows = cfg.rows, keys = cfg.keys;
    const rowH = cfg.rowH || 28, labelW = cfg.labelW || 178, valW = cfg.valW || 54;
    const h = rows.length * rowH + 8;
    const iw = Math.max(40, w - labelW - valW);
    const totals = rows.map(r => keys.reduce((a, k) => a + (r.values[k.id] || 0), 0));
    const max = (cfg.max ?? (totals.length ? Math.max(...totals) : 1)) || 1;
    const svg = svgRoot(w, h, cfg.alt);
    rows.forEach((r, i) => {
      const y = i * rowH + 4, bh = Math.min(cfg.thick || 16, rowH - 10);
      const total = totals[i];
      svg.appendChild(S('text', { x: 0, y: y + bh / 2 + 4, class: 'tick', fill: 'var(--ink-2)' }, r.label));
      svg.appendChild(S('rect', { x: labelW, y: y + (bh - 6) / 2, width: iw, height: 6, fill: 'var(--sunken)' }));
      /* los segmentos van en el orden fijo de `keys`: el color sigue a la
         categoría, nunca a su posición en esta fila */
      const drawn = keys.map(k => ({ k, v: r.values[k.id] || 0 })).filter(d => d.v > 0);
      let x = labelW;
      drawn.forEach((d, di) => {
        const segW = d.v / max * iw;
        const last = di === drawn.length - 1;
        const gap = last ? 0 : 2;
        const wide = Math.max(1, segW - gap);
        svg.appendChild(last
          ? S('path', { d: roundRightPath(x, y, wide, bh, 4), fill: d.k.color })
          : S('rect', { x, y, width: wide, height: bh, fill: d.k.color }));
        /* etiqueta directa dentro del segmento sólo si cabe con aire */
        const share = total ? d.v / total * 100 : 0;
        if (cfg.labelShare && wide > 34) {
          svg.appendChild(S('text', {
            x: x + wide / 2, y: y + bh / 2 + 4, 'text-anchor': 'middle',
            style: `font-size:11px;font-variant-numeric:tabular-nums;fill:${inkOn(d.k.color)}`,
          }, nf(share, 0) + ' %'));
        }
        x += segW;
      });
      svg.appendChild(S('text', { x: labelW + iw + 8, y: y + bh / 2 + 4, class: 'dlabel' }, fmt(total)));
      const tipRows = keys.map(k => ({
        color: k.color, value: fmt(r.values[k.id] || 0),
        name: k.name + (total ? ' · ' + nf((r.values[k.id] || 0) / total * 100, 0) + ' %' : ''),
      }));
      const aria = `${r.label}: ${fmt(total)} ${cfg.unit || ''}, `
        + keys.map(k => `${fmt(r.values[k.id] || 0)} ${k.name}`).join(', ');
      const hit = S('rect', { x: 0, y: i * rowH, width: w, height: rowH, class: 'hit cellhit', tabindex: 0, 'aria-label': aria });
      const show = ev => { const b = svg.getBoundingClientRect(); tipShow(ev?.clientX ?? b.left + labelW, ev?.clientY ?? b.top + y, r.label, tipRows); };
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerleave', tipHide);
      hit.addEventListener('focus', () => show()); hit.addEventListener('blur', tipHide);
      svg.appendChild(hit);
    });
    return svg;
  };
}

/* ---------- línea temporal con crosshair ----------
   Acepta huecos: un `null` en `values` parte la línea en vez de inventar el
   tramo. Hace falta porque hay meses en los que un idioma no reúne muestra
   suficiente, y unir esos puntos dibujaría una tendencia que no existe.
   `thin` marca los puntos con base pequeña: se pintan huecos, no macizos. */
function lineChart(cfg) {
  const fmt = cfg.fmt || (v => nf(v, 0));
  return (w) => {
    const h = cfg.height || 208;
    const pad = { t: 12, r: cfg.padR ?? 58, b: 26, l: cfg.padL ?? 54 };
    const iw = Math.max(60, w - pad.l - pad.r), ih = h - pad.t - pad.b;
    const all = cfg.series.flatMap(s => s.values).filter(v => v !== null && Number.isFinite(v));
    const lo = cfg.yZero ? 0 : (all.length ? Math.min(...all) : 0);
    const hi = all.length ? Math.max(...all) : 1;
    let ticks = niceTicks(lo - (cfg.yZero ? 0 : (hi - lo) * .12), hi + (hi - lo) * .08 || hi * 1.05, 4);
    if (cfg.yMax !== undefined) {           /* nada por encima del techo real de la escala */
      ticks = ticks.filter(t => t <= cfg.yMax);
      if (ticks[ticks.length - 1] < cfg.yMax) ticks.push(cfg.yMax);
    }
    let y0 = ticks[0], y1 = ticks[ticks.length - 1];
    /* Serie plana (el filtro fija una sola nota, o todos los meses coinciden):
       el eje se quedaría con un tick y (v-y0)/(y1-y0) sería 0/0. Se abre un
       punto hacia abajo para respetar el techo de la escala. */
    if (!(y1 > y0)) { y0 = y0 - 1; ticks = [y0, y1]; }
    const n = cfg.x.length;
    const X = i => pad.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
    const Y = v => pad.t + ih - (v - y0) / (y1 - y0) * ih;
    const svg = svgRoot(w, h, cfg.alt);

    /* bandas de jornada — dato real del contexto: los picos son días de partido */
    if (cfg.bands && cfg.bands.length) {
      const bw = n > 1 ? iw / (n - 1) : iw;
      cfg.bands.forEach(i => svg.appendChild(S('rect', {
        x: clamp(X(i) - bw / 2, pad.l, pad.l + iw), y: pad.t,
        width: Math.min(bw, pad.l + iw - clamp(X(i) - bw / 2, pad.l, pad.l + iw)),
        height: ih, fill: 'var(--sunken)'
      })));
    }
    ticks.forEach(t => {
      svg.appendChild(gridLine(pad.l, pad.l + iw, Y(t)));
      svg.appendChild(S('text', { x: pad.l - 8, y: Y(t) + 3.5, class: 'tick', 'text-anchor': 'end' }, fmt(t)));
    });
    svg.appendChild(S('line', { x1: pad.l, x2: pad.l + iw, y1: pad.t + ih, y2: pad.t + ih, stroke: 'var(--axis)', 'stroke-width': 1 }));

    const every = Math.max(1, Math.ceil(n / (iw / 62)));
    cfg.x.forEach((lb, i) => {
      if (i % every && i !== n - 1) return;
      svg.appendChild(S('text', { x: X(i), y: h - 8, class: 'tick', 'text-anchor': i === n - 1 ? 'end' : 'middle' }, lb.replace('sem. ', '')));
    });

    /* trazado por tramos: cada hueco corta la línea y empieza otra */
    const pathOf = vals => {
      let d = '', pen = false;
      vals.forEach((v, i) => {
        if (v === null || !Number.isFinite(v)) { pen = false; return; }
        d += (pen ? 'L' : 'M') + X(i) + ' ' + Y(v);
        pen = true;
      });
      return d;
    };
    cfg.series.forEach(s => {
      const d = pathOf(s.values);
      if (d) svg.appendChild(S('path', {
        d, fill: 'none', stroke: s.color, 'stroke-width': 2,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }));
    });
    /* un punto por dato: hueco cuando la base es pequeña */
    cfg.series.forEach((s, si) => {
      s.values.forEach((v, i) => {
        if (v === null || !Number.isFinite(v)) return;
        const isThin = cfg.thin && cfg.thin[si] && cfg.thin[si][i];
        svg.appendChild(S('circle', {
          cx: X(i), cy: Y(v), r: 4,
          fill: isThin ? 'var(--card)' : s.color,
          stroke: s.color, 'stroke-width': 2,
        }));
      });
    });
    /* etiqueta directa en el último punto CON dato de cada serie, evitando
       colisiones: nunca un número en cada punto */
    const lastOf = s => {
      for (let i = s.values.length - 1; i >= 0; i--) {
        const v = s.values[i];
        if (v !== null && Number.isFinite(v)) return i;
      }
      return -1;
    };
    const ends = cfg.series.map(s => ({ s, i: lastOf(s) })).filter(e => e.i >= 0)
      .map(e => ({ s: e.s, i: e.i, y: Y(e.s.values[e.i]) })).sort((a, b) => a.y - b.y);
    const shown = [];
    ends.forEach(e => {
      if (!shown.some(o => Math.abs(o.y - e.y) < 14 && o.i === e.i)) shown.push(e);
    });
    shown.forEach(e => svg.appendChild(S('text', {
      x: X(e.i) + 9, y: e.y + 4, class: 'dlabel' + (e.s.emph ? '' : ' sec'),
    }, fmt(e.s.values[e.i]))));

    /* capa de hover / teclado */
    const cross = S('line', { y1: pad.t, y2: pad.t + ih, stroke: 'var(--axis)', 'stroke-width': 1, opacity: 0 });
    svg.appendChild(cross);
    const dots = cfg.series.map(s => { const c = S('circle', { r: 4.5, fill: s.color, stroke: 'var(--card)', 'stroke-width': 2, opacity: 0 }); svg.appendChild(c); return c; });
    const hit = S('rect', { x: pad.l, y: pad.t, width: iw, height: ih, class: 'hit', tabindex: 0, role: 'application', 'aria-label': cfg.aria || cfg.alt || '' });
    let idx = -1;
    const showAt = (i, cx, cy) => {
      idx = clamp(i, 0, n - 1);
      cross.setAttribute('x1', X(idx)); cross.setAttribute('x2', X(idx)); cross.setAttribute('opacity', 1);
      dots.forEach((d, k) => {
        const v = cfg.series[k].values[idx];
        if (v === null || !Number.isFinite(v)) { d.setAttribute('opacity', 0); return; }
        d.setAttribute('cx', X(idx)); d.setAttribute('cy', Y(v)); d.setAttribute('opacity', 1);
      });
      const r = svg.getBoundingClientRect(), sc = r.width / w;
      const first = cfg.series.find(s => s.values[idx] !== null && Number.isFinite(s.values[idx]));
      tipShow(cx ?? r.left + X(idx) * sc,
        cy ?? r.top + (first ? Y(first.values[idx]) : pad.t) * sc,
        cfg.x[idx],
        cfg.series.map((s, k) => ({
          color: s.color,
          value: (s.values[idx] === null || !Number.isFinite(s.values[idx]))
            ? '—' : fmt(s.values[idx]),
          name: s.name + (cfg.bases && cfg.bases[k] && cfg.bases[k][idx] !== undefined
            ? ' · n=' + nf(cfg.bases[k][idx]) : ''),
        })));
    };
    const clear = () => { cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); tipHide(); };
    hit.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect(), sc = r.width / w;
      showAt(Math.round(((ev.clientX - r.left) / sc - pad.l) / (iw / Math.max(1, n - 1))), ev.clientX, ev.clientY);
    });
    hit.addEventListener('pointerleave', clear);
    hit.addEventListener('focus', () => showAt(idx < 0 ? n - 1 : idx));
    hit.addEventListener('blur', clear);
    hit.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowRight') { showAt(idx + 1); ev.preventDefault(); }
      if (ev.key === 'ArrowLeft') { showAt(idx - 1); ev.preventDefault(); }
      if (ev.key === 'Escape') clear();
    });
    svg.appendChild(hit);
    return svg;
  };
}

/* ---------- barras horizontales (una serie, un color) ---------- */
function barsH(cfg) {
  const fmt = cfg.fmt || (v => nf(v, 0));
  return (w) => {
    const rows = cfg.rows, rowH = cfg.rowH || 26, labelW = cfg.labelW || 118, valW = cfg.valW || 62;
    const h = rows.length * rowH + 8;
    const iw = Math.max(40, w - labelW - valW);
    const max = cfg.max ?? (rows.length ? Math.max(...rows.map(r => r.value)) : 1);
    const min = cfg.min ?? 0;
    const span = (max - min) || 1;   /* corte vacío o todo igual: nunca 0/0 */
    const X = v => labelW + clamp((v - min) / span, 0, 1) * iw;
    const svg = svgRoot(w, h, cfg.alt);
    rows.forEach((r, i) => {
      const y = i * rowH + 4, bh = Math.min(cfg.thick || 16, rowH - 8);
      const bw = Math.max(2, (r.value - min) / span * iw);
      svg.appendChild(S('text', { x: 0, y: y + bh / 2 + 4, class: 'tick', fill: 'var(--ink-2)' }, r.label));
      svg.appendChild(S('rect', { x: labelW, y: y + (bh - 6) / 2, width: iw, height: 6, fill: 'var(--sunken)' }));
      svg.appendChild(S('path', { d: roundRightPath(labelW, y, bw, bh, 4), fill: r.color || cfg.color || 'var(--s1)' }));
      svg.appendChild(S('text', { x: labelW + iw + 8, y: y + bh / 2 + 4, class: 'dlabel' }, fmt(r.value)));
      /* La nota se rotula dentro de la barra sólo si el texto cabe con aire;
         si no, se queda en el tooltip y en la tabla. */
      if (r.note && bw > r.note.length * 6.1 + 20) {
        svg.appendChild(S('text', {
          x: labelW + bw - 9, y: y + bh / 2 + 4, 'text-anchor': 'end',
          style: `font-size:11.5px;font-variant-numeric:tabular-nums;fill:${inkOn(r.color || cfg.color || 'var(--s1)')}`
        }, r.note));
      }
      /* Incertidumbre a la vista: con n pequeño la barra sola invita a
         conclusiones que el intervalo desmiente. Se dibuja encima. */
      if (r.ci) {
        const cy = y + bh / 2, x1 = X(r.ci[0]), x2 = X(r.ci[1]);
        svg.appendChild(S('line', { x1, x2, y1: cy, y2: cy, stroke: 'var(--ink-2)', 'stroke-width': 1.5 }));
        [x1, x2].forEach(cx => svg.appendChild(S('line', {
          x1: cx, x2: cx, y1: cy - 4, y2: cy + 4, stroke: 'var(--ink-2)', 'stroke-width': 1.5,
        })));
      }
      const ariaCi = r.ci ? ', ' + t('IC 95 %') + ' ' + fmt(r.ci[0]) + ' – ' + fmt(r.ci[1]) : '';
      const hit = S('rect', { x: 0, y: i * rowH, width: w, height: rowH, class: 'hit cellhit', tabindex: 0, 'aria-label': `${r.label}: ${fmt(r.value)}${ariaCi}${r.note ? ', ' + r.note : ''}` });
      const show = ev => { const b = svg.getBoundingClientRect(); tipShow(ev?.clientX ?? b.left + labelW + bw, ev?.clientY ?? b.top + y, r.label, [{ color: r.color || cfg.color || 'var(--s1)', value: fmt(r.value), name: cfg.unit || '' }].concat(r.rows || [])); };
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerleave', tipHide);
      hit.addEventListener('focus', () => show()); hit.addEventListener('blur', tipHide);
      svg.appendChild(hit);
    });
    return svg;
  };
}
</script>

<script>
/* ---------- mapa de calor / matriz de cohortes (secuencial, un tono) ---------- */
const SEQ = ['var(--q1)', 'var(--q2)', 'var(--q3)', 'var(--q4)', 'var(--q5)', 'var(--q6)'];
/* La tinta de la celda se decide por la luminancia del relleno, no por el paso:
   en modo oscuro los pasos altos de la rampa son los CLAROS. */
function heatmap(cfg) {
  const fmt = cfg.fmt || (v => nf(v, 0));
  return (w) => {
    const rowsN = cfg.rows.length, colsN = cfg.cols.length;
    const labelW = cfg.labelW || 74, topH = 18, rowH = cfg.rowH || 22, gap = 2;
    const h = topH + rowsN * rowH + 4;
    const cw = Math.max(8, (w - labelW) / colsN);
    const vals = cfg.rows.flatMap(r => r.values.filter(v => v !== null));
    const lo = cfg.min ?? (vals.length ? Math.min(...vals) : 0);
    const hi = cfg.max ?? (vals.length ? Math.max(...vals) : 1);
    const bin = v => clamp(Math.floor((v - lo) / ((hi - lo) || 1) * SEQ.length), 0, SEQ.length - 1);
    const svg = svgRoot(w, h, cfg.alt);
    cfg.cols.forEach((c, ci) => {
      if (colsN > 14 && ci % 2) return;
      svg.appendChild(S('text', { x: labelW + ci * cw + cw / 2, y: 12, class: 'tick', 'text-anchor': 'middle' }, c));
    });
    cfg.rows.forEach((r, ri) => {
      const y = topH + ri * rowH;
      svg.appendChild(S('text', { x: 0, y: y + rowH / 2 + 3.5, class: 'tick', fill: 'var(--ink-2)' }, r.label));
      r.values.forEach((v, ci) => {
        if (v === null) return;
        const neutral = (cfg.neutralCols || []).includes(ci);
        const b = bin(v), x = labelW + ci * cw;
        const fill = neutral ? 'var(--sunken)' : SEQ[b];
        svg.appendChild(S('rect', { x, y, width: Math.max(1, cw - gap), height: rowH - gap, fill, rx: 1 }));
        if (cfg.showValues && cw > 34) svg.appendChild(S('text', { x: x + (cw - gap) / 2, y: y + rowH / 2 + 3.5, 'text-anchor': 'middle', style: `font-size:11px;font-variant-numeric:tabular-nums;fill:${neutral ? 'var(--ink-3)' : inkOn(fill)}` }, fmt(v)));
        const hit = S('rect', { x, y, width: Math.max(1, cw - gap), height: rowH - gap, class: 'hit cellhit', tabindex: 0, 'aria-label': `${r.label}, ${cfg.cols[ci]}: ${fmt(v)}` });
        const show = ev => { const bb = svg.getBoundingClientRect(); tipShow(ev?.clientX ?? bb.left + x, ev?.clientY ?? bb.top + y, r.label + ' · ' + cfg.cols[ci], [{ color: fill, value: fmt(v), name: cfg.unit || '' }]); };
        hit.addEventListener('pointermove', show); hit.addEventListener('pointerleave', tipHide);
        hit.addEventListener('focus', () => show()); hit.addEventListener('blur', tipHide);
        svg.appendChild(hit);
      });
    });
    return svg;
  };
}
function scaleLegend(lo, hi, fmt = v => nf(v, 0)) {
  if (!Number.isFinite(lo)) lo = 0;
  if (!Number.isFinite(hi)) hi = 1;
  const box = E('div', 'legend');
  box.style.alignItems = 'center';
  box.appendChild(E('span', '', fmt(lo)));
  SEQ.forEach(c => { const i = E('i', 'rect'); i.style.background = c; i.style.width = '22px'; i.style.height = '9px'; box.appendChild(i); });
  box.appendChild(E('span', '', fmt(hi)));
  return box;
}

/* ---------- embudo (rampa ordinal) ---------- */
const ORD = ['var(--o1)', 'var(--o2)', 'var(--o3)', 'var(--o4)', 'var(--o5)'];
function funnel(cfg) {
  return (w) => {
    const steps = cfg.steps, rowH = 52, valW = 128;
    const h = steps.length * rowH + 12;   /* aire arriba: la etiqueta del paso 1 va encima de su barra */
    const iw = Math.max(60, w - valW);
    const top = steps.length ? steps[0].value : 0;
    const den = top || 1;            /* embudo vacío: se dibuja a cero, sin NaN */
    const svg = svgRoot(w, h, cfg.alt);
    steps.forEach((s, i) => {
      const y = i * rowH + 20, bh = 22;
      const bw = Math.max(3, s.value / den * iw);
      const c = ORD[Math.min(i, ORD.length - 1)];
      svg.appendChild(S('text', { x: 0, y: y - 4, style: 'font-size:12.5px;fill:var(--ink-2)' }, `${i + 1}. ${s.label}`));
      svg.appendChild(S('path', { d: roundRightPath(0, y, bw, bh, 4), fill: c }));
      svg.appendChild(S('text', { x: iw + 10, y: y + bh / 2 + 4, class: 'dlabel' }, compact(s.value)));
      svg.appendChild(S('text', { x: iw + 10, y: y + bh / 2 + 19, class: 'dlabel sec' }, t('{p} % del inicio', { p: nf(s.value / den * 100, 1) })));
      if (i > 0) {
        const prev = steps[i - 1].value;
        const drop = prev ? (1 - s.value / prev) * 100 : 0;
        const bad = drop > 45;
        svg.appendChild(S('text', {
          x: 4, y: y - 20, style: `font-size:11.5px;font-weight:600;fill:${bad ? 'var(--crit)' : 'var(--ink-3)'}`
        }, (bad ? '▼ ' : '↓ ') + t('caída {p} %', { p: nf(drop, 1) })));
      }
      const hit = S('rect', { x: 0, y: i * rowH + 14, width: w, height: rowH, class: 'hit cellhit', tabindex: 0, 'aria-label': s.label + ': ' + NF.format(Math.round(s.value)) + ', ' + t('{p} % del inicio', { p: nf(s.value / den * 100, 1) }) });
      const show = ev => { const b = svg.getBoundingClientRect(); tipShow(ev?.clientX ?? b.left + bw, ev?.clientY ?? b.top + y, s.label, [{ color: c, value: NF.format(Math.round(s.value)), name: cfg.unit || '' }, { value: nf(s.value / den * 100, 1) + ' %', name: t('del inicio') }].concat(s.hint ? [{ value: s.hint, name: '' }] : [])); };
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerleave', tipHide);
      hit.addEventListener('focus', () => show()); hit.addEventListener('blur', tipHide);
      svg.appendChild(hit);
    });
    return svg;
  };
}

/* ---------- barras divergentes (polos frío/cálido, cero neutro) ---------- */
function diverging(cfg) {
  const fmt = cfg.fmt || (v => signed(v, 2));
  return (w) => {
    const rows = cfg.rows, rowH = 26, labelW = cfg.labelW || 96, valW = 66;
    const h = rows.length * rowH + 6;
    const iw = Math.max(60, w - labelW - valW);
    const mRaw = cfg.max ?? (rows.length ? Math.max(...rows.map(r => Math.abs(r.value))) * 1.28 : 1);
    const m = mRaw || 1;             /* saldo todo a cero: nunca 0/0 */
    const mid = labelW + iw / 2;
    const svg = svgRoot(w, h, cfg.alt);
    svg.appendChild(S('rect', { x: mid - 1, y: 0, width: 2, height: rows.length * rowH + 2, fill: 'var(--div-mid)' }));
    rows.forEach((r, i) => {
      const y = i * rowH + 5, bh = 15;
      const len = Math.abs(r.value) / m * (iw / 2);
      const pos = r.value >= 0;
      const c = pos ? 'var(--div-pos)' : 'var(--div-neg)';
      svg.appendChild(S('text', { x: 0, y: y + bh / 2 + 4, class: 'tick', fill: 'var(--ink-2)' }, r.label));
      const d = pos ? roundRightPath(mid + 1, y, len, bh, 4)
        : `M${mid - 1} ${y}L${mid - 1} ${y + bh}L${mid - len + 4} ${y + bh}Q${mid - len} ${y + bh} ${mid - len} ${y + bh - 4}L${mid - len} ${y + 4}Q${mid - len} ${y} ${mid - len + 4} ${y}Z`;
      svg.appendChild(S('path', { d, fill: c }));
      svg.appendChild(S('text', { x: labelW + iw + 8, y: y + bh / 2 + 4, style: `font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;fill:var(--ink)` }, (pos ? '▲ ' : '▼ ') + fmt(r.value)));
      const hit = S('rect', { x: 0, y: i * rowH, width: w, height: rowH, class: 'hit cellhit', tabindex: 0, 'aria-label': r.label + ': ' + (pos ? t('por encima de la media') : t('por debajo de la media')) + ', ' + fmt(r.value) });
      const show = ev => { const b = svg.getBoundingClientRect(); tipShow(ev?.clientX ?? b.left + mid, ev?.clientY ?? b.top + y, r.label, [{ color: c, value: fmt(r.value), name: cfg.unit || 'vs media' }].concat(r.rows || [])); };
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerleave', tipHide);
      hit.addEventListener('focus', () => show()); hit.addEventListener('blur', tipHide);
      svg.appendChild(hit);
    });
    return svg;
  };
}

/* ---------- columnas agrupadas (un solo eje; series indexadas) ---------- */
function groupedCols(cfg) {
  const fmt = cfg.fmt || (v => nf(v, 0));
  return (w) => {
    const h = cfg.height || 224, pad = { t: 12, r: 8, b: 42, l: 46 };
    const groups = cfg.groups, series = cfg.series;
    const iw = Math.max(60, w - pad.l - pad.r), ih = h - pad.t - pad.b;
    const all = series.flatMap(s => s.values).filter(v => Number.isFinite(v));
    const ticks = niceTicks(0, (all.length ? Math.max(...all) : 1) * 1.06 || 1, 4);
    const y1 = ticks[ticks.length - 1] || 1;
    const Y = v => pad.t + ih - v / y1 * ih;
    const gw = iw / groups.length;
    const bandW = Math.min(gw * .72, series.length * 26);
    const bw = Math.min(24, (bandW - (series.length - 1) * 2) / series.length);
    const svg = svgRoot(w, h, cfg.alt);
    ticks.forEach(t => {
      svg.appendChild(gridLine(pad.l, pad.l + iw, Y(t)));
      svg.appendChild(S('text', { x: pad.l - 8, y: Y(t) + 3.5, class: 'tick', 'text-anchor': 'end' }, fmt(t)));
    });
    if (cfg.refLine !== undefined) {
      svg.appendChild(S('line', { x1: pad.l, x2: pad.l + iw, y1: Y(cfg.refLine), y2: Y(cfg.refLine), stroke: 'var(--axis)', 'stroke-width': 1 }));
      svg.appendChild(S('text', { x: pad.l + 4, y: Y(cfg.refLine) - 5, class: 'tick', fill: 'var(--ink-2)' }, cfg.refLabel || ''));
    }
    groups.forEach((g, gi) => {
      const cx = pad.l + gi * gw + gw / 2;
      const x0 = cx - (bw * series.length + (series.length - 1) * 2) / 2;
      series.forEach((s, si) => {
        const v = s.values[gi], x = x0 + si * (bw + 2);
        svg.appendChild(S('path', { d: roundTopPath(x, Y(v), bw, pad.t + ih - Y(v), 4), fill: s.color }));
        const hit = S('rect', { x: x - 1, y: pad.t, width: bw + 2, height: ih, class: 'hit cellhit', tabindex: 0, 'aria-label': `${g}, ${s.name}: ${fmt(v)}` });
        const show = ev => { const b = svg.getBoundingClientRect(); tipShow(ev?.clientX ?? b.left + x, ev?.clientY ?? b.top + Y(v), g, series.map(ss => ({ color: ss.color, value: fmt(ss.values[gi]), name: ss.name }))); };
        hit.addEventListener('pointermove', show); hit.addEventListener('pointerleave', tipHide);
        hit.addEventListener('focus', () => show()); hit.addEventListener('blur', tipHide);
        svg.appendChild(hit);
      });
      g.split('\n').forEach((ln, k) => svg.appendChild(S('text', { x: cx, y: h - 26 + k * 13, class: 'tick', 'text-anchor': 'middle' }, ln)));
    });
    svg.appendChild(S('line', { x1: pad.l, x2: pad.l + iw, y1: pad.t + ih, y2: pad.t + ih, stroke: 'var(--axis)', 'stroke-width': 1 }));
    return svg;
  };
}

/* ---------- leyenda ---------- */
function legend(items, kind = 'rect') {
  const box = E('div', 'legend');
  items.forEach(it => {
    const s = E('span');
    const i = E('i', it.kind || kind); i.style.background = it.color;
    s.appendChild(i); s.appendChild(document.createTextNode(it.name));
    box.appendChild(s);
  });
  return box;
}
/* ---------- tabla ---------- */
function table(head, rows, foot) {
  const wrap = E('div', 'tblwrap'), t = E('table'), th = E('thead'), tr = E('tr');
  head.forEach(h => tr.appendChild(E('th', '', h))); th.appendChild(tr); t.appendChild(th);
  const tb = E('tbody');
  rows.forEach(r => {
    const x = E('tr');
    r.forEach(c => {
      const td = E('td');
      if (c instanceof Node) td.appendChild(c); else td.textContent = c;
      x.appendChild(td);
    });
    tb.appendChild(x);
  });
  t.appendChild(tb);
  if (foot) { const tf = E('tfoot'), fr = E('tr'); foot.forEach(c => { const td = E('td'); if (c instanceof Node) td.appendChild(c); else td.textContent = c; fr.appendChild(td); }); tf.appendChild(fr); t.appendChild(tf); }
  wrap.appendChild(t); return wrap;
}
function meter(v, max, color) {
  const m = E('span', 'meter'), i = E('i');
  i.style.width = clamp(v / max * 100, 0, 100) + '%'; if (color) i.style.background = color;
  m.appendChild(i); return m;
}

<script>
/* ==========================================================================
   COMPONENTES DE TARJETA
   ========================================================================== */
let VARCACHE = {};
function cssVar(v) {
  if (!v || !v.startsWith('var(')) return v;
  const name = v.slice(4, -1).trim();
  if (VARCACHE[name]) return VARCACHE[name];
  return VARCACHE[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
}
function inkOn(color) {
  const c = cssVar(color).match(/\d+(\.\d+)?/g);
  if (!c) return '#fff';
  const lum = [0, 1, 2].map(i => { const x = c[i] / 255; return x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; });
  return (.2126 * lum[0] + .7152 * lum[1] + .0722 * lum[2]) > .42 ? '#191d15' : '#ffffff';
}

function card(span, cls = '') {
  const c = E('div', `card ${span} ${cls}`.trim());
  return c;
}
function head(el, title, sub, extra) {
  const h = E('div', 'chead'), box = E('div');
  box.appendChild(E('h3', '', title));
  if (sub) box.appendChild(E('p', '', sub));
  h.appendChild(box);
  h.appendChild(E('div', 'spacer'));
  if (extra) h.appendChild(extra);
  el.appendChild(h);
  return h;
}
/* Tarjeta de gráfica con gemela en tabla (todo valor accesible sin hover) */
function plotCard(o) {
  const c = card(o.span, 'plot');
  let showing = 'chart';
  const btn = E('button', 'mini', t('Tabla'));
  btn.type = 'button'; btn.setAttribute('aria-pressed', 'false');
  head(c, o.title, o.sub, o.tableFn ? btn : o.extra);
  /* El titular va calculado del corte, no escrito a mano: dice el hallazgo en
     palabras y se rehace con cada filtro. Es aritmética, no interpretación. */
  if (o.insight) c.appendChild(E('p', 'insight', o.insight));
  if (o.legend) c.appendChild(o.legend);
  const box = E('div', 'plotbox');
  c.appendChild(box);
  mount(box, o.draw);
  if (o.note) { const n = E('p', '', o.note); n.style.cssText = 'margin:0;font-size:12px;color:var(--ink-3)'; c.appendChild(n); }
  if (o.key) mod(c, o.key, o.title);
  if (o.tableFn) {
    btn.addEventListener('click', () => {
      showing = showing === 'chart' ? 'table' : 'chart';
      btn.setAttribute('aria-pressed', String(showing === 'table'));
      btn.textContent = showing === 'table' ? t('Gráfica') : t('Tabla');
      unmount(box);
      box.textContent = '';
      if (showing === 'table') box.appendChild(o.tableFn());
      else mount(box, o.draw);
    });
  }
  return c;
}
function kpiTile(o) {
  const t = E('div', 'kpi');
  t.appendChild(E('div', 'lbl', o.label));
  const row = E('div', 'row');
  row.appendChild(E('div', 'val', o.value));
  if (o.spark) row.appendChild(o.spark);
  t.appendChild(row);
  if (o.delta !== undefined) {
    const dir = o.delta > .3 ? 'up' : o.delta < -.3 ? 'down' : 'flat';
    const good = o.inverse ? dir === 'down' : dir === 'up';
    const d = E('div', 'delta ' + (dir === 'flat' ? 'flat' : good ? 'up' : 'down'));
    d.textContent = (dir === 'up' ? '▲' : dir === 'down' ? '▼' : '■') + ' ' + signed(o.delta, 1) + ' %'
      + (o.deltaNote ? ' ' + o.deltaNote : '');
    t.appendChild(d);
  }
  if (o.foot) t.appendChild(E('div', 'lbl', o.foot));
  return t;
}
function readCard(title, items) {
  const c = E('div', 'read c12');
  c.appendChild(E('h4', '', title));
  const ol = E('ol');
  items.forEach(it => {
    const li = E('li');
    const s = E('strong', '', it.what); li.appendChild(s);
    li.appendChild(document.createTextNode(' — ' + it.why + ' '));
    if (it.why2) { const w = E('span', 'why', it.why2); li.appendChild(w); }
    ol.appendChild(li);
  });
  c.appendChild(ol);
  return c;
}
function eyebrow(text, key) {
  const e = E('div', 'eyebrow c12');
  e.appendChild(document.createTextNode(text));
  e.appendChild(E('span', 'rule'));
  return key ? mod(e, key, text) : e;
}
</script>

  /* `rating` admite una nota suelta ('1'..'5') o un signo ('neg'/'neu'/'pos') */
  const rt = (ignore.rating || rstate.rating === 'all') ? null : rstate.rating;
  const sgn = rt && SIGNL[rt] ? SIGNL[rt].has : null;
  const one = rt && !sgn ? +rt : 0;
  const from = rstate.from, to = rstate.to;
  const out = [];
  for (let i = 0; i < RN; i++) {
    if (R_dayn[i] < from || R_dayn[i] > to) continue;
    if (li === -2) { if (R_lang[i] <= 3) continue; }
    else if (li >= 0 && R_lang[i] !== li) continue;
    if (fi >= 0 && R_fam[i] !== fi) continue;
    if (sgn) { if (!sgn(R_rat[i])) continue; }
    else if (one && R_rat[i] !== one) continue;
    out.push(i);
  }
  return out;
}
/* índices en RD.rev que pasan el corte, incluidos los filtros de texto */
function rSelText(ignore = {}) {
  const out = [];
  for (const i of rSel(ignore)) {
    const ti = R_text[i]; if (ti < 0) continue;
    const rec = RD.rev[ti];
    if (rstate.content && !rec.k) continue;
    if (rstate.fric && !rec.w) continue;
    if (!ignore.sent && rstate.sent !== 'all' && rec.s !== rstate.sent) continue;
    if (!ignore.topic && rstate.topic !== 'all' && rec.g.indexOf(rstate.topic) < 0) continue;
    out.push(ti);
  }
  return out;
}

/* ------------------------------------------------------------- agregaciones */
const BUCK = () => [0, 0, 0, 0, 0];
function statOf(a) {
  const n = a[0] + a[1] + a[2] + a[3] + a[4];
  return {
    n, dist: a,
    avg: n ? (a[0] + 2 * a[1] + 3 * a[2] + 4 * a[3] + 5 * a[4]) / n : 0,
    bad: n ? (a[0] + a[1]) / n * 100 : 0,
    top: n ? a[4] / n * 100 : 0,
  };
}
function bucketBy(ids, keyFn) {
  const m = new Map();
  for (const i of ids) {
    const k = keyFn(i); if (k === null || k === undefined) continue;
    let a = m.get(k); if (!a) m.set(k, a = BUCK());
    a[R_rat[i] - 1]++;
  }
  return m;
}
function wilson(k, n, z = 1.96) {
  if (!n) return [0, 0];
  const p = k / n, den = 1 + z * z / n, c = p + z * z / (2 * n);
  const m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
  return [(c - m) / den, (c + m) / den];
}
/* lunes de la semana de una fecha YYYYMMDD */
function weekOf(n) {
  const d = new Date(Date.UTC(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100));
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}
const MONTHS_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const monthName = i => t(MONTHS_ES[i]);
const dmy = n => String(n % 100).padStart(2, '0') + '/' + String(Math.floor(n / 100) % 100).padStart(2, '0');
const star = v => nf(v, 2);
const rpct = (v, d = 1) => nf(v, d) + ' %';

/* etiqueta del corte activo, para que cada vista diga sobre qué habla */
function rCutLabel() {
  const p = [dmy(rstate.from) + ' – ' + dmy(rstate.to)];
  if (rstate.lang !== 'all') p.push(rstate.lang === 'otros' ? t('resto de idiomas') : langName(rstate.lang));
  if (rstate.fam !== 'all') p.push(famLabel(rstate.fam));
  if (rstate.rating !== 'all') p.push(SIGNL[rstate.rating] ? signLabel(rstate.rating) : rstate.rating + '★');
  return p.join(' · ');
}
function srcNote(extra) {
  const p = E('p', 'srcnote c12');
  p.textContent = t('Fuente: {src} · {n} valoraciones recogidas entre el {a} y el {b} de 2026',
    { src: RD.meta.source, n: nf(RD.meta.n), a: dmy(D_FROM), b: dmy(D_TO) })
    + (RD.meta.dedup ? ' · ' + t('{d} reingestas descartadas', { d: RD.meta.dedup }) : '')
    + (extra ? ' · ' + extra : '');
  return p;
}

/* Corte sin datos: se dice, no se dibuja un gráfico de ceros. */
function emptyCut(title, msg) {
  const c = card('c12');
  head(c, title, rCutLabel());
  const p = E('p', '', msg);
  p.style.cssText = 'margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5;max-width:62ch';
  c.appendChild(p);
  const b = E('button', 'mini', t('Restablecer filtros'));
  b.type = 'button';
  b.style.cssText = 'margin-top:12px';
  b.addEventListener('click', () => $('#r-reset').click());
  c.appendChild(b);
  return c;
}

/* =============================== VISTA · RATING =========================== */
function renderRating(root) {
  const g = E('div', 'grid');
  const ids = rSel();

  const nText = ids.reduce((s, i) => s + (R_text[i] >= 0 ? 1 : 0), 0);

  const medLat = lats.length ? lats[Math.floor(lats.length / 2)] : 0;
  const globalBad = statOf(bucketBy(rSel({ lang: 1, fam: 1, rating: 1 }), () => 1).get(1) || BUCK()).bad;

  g.appendChild(eyebrow(t('La nota · lo que puntúan los que puntúan')));

    g.appendChild(emptyCut(t('Ninguna valoración cumple este corte'),

  }

  /* --- héroe: la única cifra grande de la vista --- */
  const hero = card('c5');
  const hb = E('div', 'hero'), left = E('div');
  left.appendChild(E('div', 'lbl', t('Rating medio') + ' · ' + rCutLabel()));
  left.appendChild(E('div', 'fig', star(all.avg) + ' / 5'));
  /* con el corte completo la diferencia es cero: decirlo, no pintar «+0,00» */
  const gap = all.avg - RD.meta.avg;
  const flat = Math.abs(gap) < 0.005;
  const dl = E('div', 'delta ' + (flat ? 'flat' : gap > 0 ? 'up' : 'down'));
  dl.textContent = flat
    ? '■ ' + t('en la media global')

  left.appendChild(dl);
  hb.appendChild(left);
  const side = E('div', 'side');
  side.appendChild(E('div', '', t('{n} valoraciones en el corte', { n: nf(all.n) })));
  const sm = E('div'); sm.style.marginTop = '8px';
  sm.appendChild(E('div', '', t('Reparto de 5★')));
  const mt = meter(all.top, 100, 'var(--q5)'); mt.style.margin = '5px 0 3px'; sm.appendChild(mt);
  sm.appendChild(E('div', '', t('{p} de las notas son 5★', { p: rpct(all.top) })));
  side.appendChild(sm);
  hb.appendChild(side);
  hero.appendChild(hb);
  g.appendChild(mod(hero, 'hero', t('Rating medio')));

  /* --- distribución: 1-5★ es ordinal, rampa ordinal --- */
  const distRows = [5, 4, 3, 2, 1].map((s, k) => ({
    label: s + '★', value: all.dist[s - 1],
    color: ORD[Math.min(k, ORD.length - 1)],
    rows: [{ color: 'var(--deemph)', value: rpct(all.n ? all.dist[s - 1] / all.n * 100 : 0), name: t('del corte') }],
  }));
  const uShare = all.n ? (all.dist[4] + all.dist[0]) / all.n * 100 : 0;
  const distIns = t('5★ y 1★ suman el {p} de las valoraciones del corte.', { p: rpct(uShare) });
  g.appendChild(plotCard({
    key: 'dist', span: 'c7', title: t('Reparto de la nota'), sub: t('valoraciones por cada nota, de 5★ a 1★'),
    insight: distIns,
    draw: barsH({ rows: distRows, fmt: v => nf(v), labelW: 34, valW: 66, unit: t('valoraciones'),
      alt: t('Reparto de la nota') + '. ' + distIns }),
    tableFn: () => table([t('Nota'), t('Valoraciones'), t('% del corte')],
      [5, 4, 3, 2, 1].map(s => [s + '★', nf(all.dist[s - 1]), rpct(all.n ? all.dist[s - 1] / all.n * 100 : 0)]),

  /* --- KPI --- */
  const k = card('c12');
  const kg = E('div'); kg.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px 22px';
  [

    { label: t('Deja además un texto'), value: rpct(all.n ? nText / all.n * 100 : 0), foot: t('{a} de {b}', { a: nf(nText), b: nf(all.n) }) },
    { label: t('Respondidas por el equipo'), value: rpct(all.n ? nRep / all.n * 100 : 0), foot: t('{n} respuestas', { n: nf(nRep) }) },
    { label: t('Latencia mediana'), value: t('{n} d', { n: medLat }), foot: t('de la nota a la respuesta') },
  ].forEach(o => kg.appendChild(kpiTile(o)));
  k.appendChild(kg);
  g.appendChild(mod(k, 'kpi', t('Notas de 1★ y 2★')));

  /* --- idioma: desviación (divergente) + dolor (volumen) --- */
  g.appendChild(eyebrow(t('Por idioma'), 'eb-lang'));
  const byLang = bucketBy(rSel({ lang: 1 }), i => RD.langs[R_lang[i]]);
  const langRowsAll = [...byLang.entries()].map(([l, a]) => ({ l, s: statOf(a) }))
    .filter(r => r.s.n >= 20).sort((a, b) => b.s.n - a.s.n);
  const gAvg = statOf(bucketBy(rSel({ lang: 1 }), () => 1).get(1) || BUCK()).avg;

  const langWorst = langRowsAll.slice().sort((a, b) => a.s.avg - b.s.avg)[0];
  const langIns = langWorst
    ? t('{l} da la nota más baja: {v}, {d} respecto a la media del corte.',
        { l: langName(langWorst.l), v: star(langWorst.s.avg), d: signed(langWorst.s.avg - gAvg, 2) })
    : '';
  g.appendChild(plotCard({
    key: 'lang-dev', span: 'c6', title: t('Desviación del rating por idioma'),
    sub: t('puntos sobre la media del corte ({m}); solo idiomas con n ≥ 20', { m: star(gAvg) }),
    insight: langIns,
    draw: diverging({
      alt: t('Desviación del rating por idioma') + '. ' + langIns,
      rows: langRowsAll.map(r => ({
        label: langName(r.l), value: r.s.avg - gAvg,
        rows: [{ color: 'var(--deemph)', value: star(r.s.avg), name: t('rating') },
               { color: 'var(--deemph)', value: nf(r.s.n), name: 'n' }],
      })),
      fmt: v => signed(v, 2), labelW: 92, unit: t('vs media'),
    }),
    legend: legend([{ name: t('por encima de la media'), color: 'var(--div-pos)' },
                    { name: t('por debajo'), color: 'var(--div-neg)' }]),
    tableFn: () => table([t('Idioma'), 'n', t('Rating'), t('Desv.'), '1-2★'],
      langRowsAll.map(r => [langName(r.l), nf(r.s.n), star(r.s.avg), signed(r.s.avg - gAvg, 2), rpct(r.s.bad)])),
  }));
  g.appendChild(plotCard({
    key: 'lang-vol', span: 'c6', title: t('Dónde está el volumen de 1★ y 2★'),
    sub: t('valoraciones bajas por idioma, en absoluto'),
    draw: barsH({
      rows: langRowsAll.slice().sort((a, b) => (b.s.dist[0] + b.s.dist[1]) - (a.s.dist[0] + a.s.dist[1]))
        .map(r => ({
          label: langName(r.l), value: r.s.dist[0] + r.s.dist[1],
          rows: [{ color: 'var(--deemph)', value: rpct(r.s.bad), name: t('del idioma') }],
        })),
      color: 'var(--s3)', fmt: v => nf(v), labelW: 92, valW: 60, unit: t('valoraciones 1-2★'),
      alt: t('Dónde está el volumen de 1★ y 2★'),
    }),
    note: t('Volumen absoluto, no tasa: el idioma con más valoraciones tiende a acumular más quejas aunque su tasa sea mejor. La tasa está en la tarjeta de al lado.'),
    tableFn: () => table([t('Idioma'), '1-2★', t('Tasa'), 'n'],
      langRowsAll.map(r => [langName(r.l), nf(r.s.dist[0] + r.s.dist[1]), rpct(r.s.bad), nf(r.s.n)])),
  }));

  /* --- el confundido: idioma vs hardware --- */
  g.appendChild(eyebrow(t('Idioma o dispositivo: cuál explica la nota'), 'eb-conf'));
  const byFam = bucketBy(rSel({ fam: 1 }), i => FAMS[R_fam[i]]);
  const famRows = [...byFam.entries()].map(([f, a]) => ({ f, s: statOf(a) }))
    .filter(r => r.s.n >= 30).sort((a, b) => a.s.avg - b.s.avg);
  const famIns = famRows.length >= 2
    ? t('{a} queda {d} puntos por debajo de {b}.', {
        a: famLabel(famRows[0].f), b: famLabel(famRows[famRows.length - 1].f),
        d: nf(famRows[famRows.length - 1].s.avg - famRows[0].s.avg, 2) })
    : '';
  g.appendChild(plotCard({
    key: 'fam-rating', span: 'c6', title: t('Rating medio por familia de dispositivo'),
    sub: t('n ≥ 30 · de peor a mejor'),
    insight: famIns,
    draw: barsH({
      alt: t('Rating medio por familia de dispositivo') + '. ' + famIns,
      rows: famRows.map(r => ({
        label: famLabel(r.f), value: r.s.avg,
        color: TRANSSION.indexOf(r.f) >= 0 ? 'var(--s3)' : 'var(--s1)',
        rows: [{ color: 'var(--deemph)', value: nf(r.s.n), name: 'n' },
               { color: 'var(--deemph)', value: rpct(r.s.bad), name: '1-2★' }],
      })),
      fmt: star, labelW: 150, valW: 52, unit: '/ 5',
    }),
    legend: legend([{ name: 'Transsion (Tecno · Infinix · itel)', color: 'var(--s3)' },
                    { name: t('resto'), color: 'var(--s1)' }]),
    note: t('Los prefijos TECNO-, Infinix-, itel- y HN vienen en el propio codename. La gama Samsung A se infiere del patrón del codename y va marcada como inferida.'),
    tableFn: () => table([t('Familia'), 'n', t('Rating'), '1-2★'],
      famRows.map(r => [famLabel(r.f), nf(r.s.n), star(r.s.avg), rpct(r.s.bad)])),
  }));

  const heatFams = FAMS.filter(f => f !== 'Sin identificar');
  const hIds = rSel({ lang: 1, fam: 1 });
  const cross = new Map();
  for (const i of hIds) {
    const l = RD.langs[R_lang[i]]; if (TOP_LANGS.indexOf(l) < 0) continue;
    const kk = l + '|' + FAMS[R_fam[i]];
    let a = cross.get(kk); if (!a) cross.set(kk, a = BUCK());
    a[R_rat[i] - 1]++;
  }
  const hmRows = TOP_LANGS.map(l => ({
    label: langName(l),
    values: heatFams.map(f => {
      const a = cross.get(l + '|' + f); if (!a) return null;
      const s = statOf(a); return s.n >= 25 ? s.bad : null;
    }),
  }));
  g.appendChild(plotCard({
    key: 'heat-lang-fam', span: 'c6', title: t('Tasa de 1-2★ por idioma y familia'),
    sub: t('celdas con n ≥ 25; en blanco las que no dan para afirmar nada'),
    draw: heatmap({
      rows: hmRows, cols: heatFams.map(f => famLabel(f).replace(/ Galaxy A \(inf\.?\)$/, ' A*')),
      labelW: 84, rowH: 30, showValues: true, fmt: v => nf(v, 0) + '%', unit: '1-2★',
      alt: t('Tasa de 1-2★ por idioma y familia'),
    }),
    legend: scaleLegend(0, Math.max(...hmRows.flatMap(r => r.values.filter(v => v !== null))), v => nf(v, 0) + ' %'),
    tableFn: () => table([t('Idioma')].concat(heatFams.map(famLabel)),
      hmRows.map(r => [r.label].concat(r.values.map(v => v === null ? '—' : rpct(v))))),
  }));

  /* --- versiones --- */
  g.appendChild(eyebrow(t('Por versión y por dispositivo'), 'eb-ver'));
  const byVer = bucketBy(ids, i => RD.vers[R_ver[i]]);
  const verRows = [...byVer.entries()].map(([v, a]) => ({ v, s: statOf(a) }))
    .filter(r => r.s.n >= 60 && r.v !== '')
    .sort((a, b) => a.v.localeCompare(b.v, undefined, { numeric: true }));
  if (verRows.length) {
    g.appendChild(plotCard({
      key: 'ver', span: 'c6', title: t('Rating medio por versión de la app'),
      sub: t('versiones con n ≥ 60 · la línea es la media del corte'),
      draw: groupedCols({
        groups: verRows.map(r => r.v),
